<title>AEVUM Meal Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap">
<style>
:root {
  --bg:#FBFAF7;--bg-deep:#F2EDE2;--fg:#1A1A1A;--fg-soft:#4a463f;
  --gold:#B08D2E;--gold-deep:#8f6f1f;--gold-light:#d8b95e;
  --card:#ffffff;--line:#EBE5D8;--muted:#938c7d;
  --ok:#3a7d44;--warn:#c4820e;--over:#b83230;--tag-bg:#f0ebe0;
  --input-bg:#faf8f5;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141312;--bg-deep:#1e1c1a;--fg:#e8e4dc;--fg-soft:#9a9385;
    --gold:#d8b95e;--gold-deep:#B08D2E;--gold-light:#e8cc7a;
    --card:#1e1c1a;--line:#332e28;--muted:#6e6860;
    --ok:#5db86a;--warn:#e0a030;--over:#e05550;--tag-bg:#2a2622;
    --input-bg:#252320;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141312;--bg-deep:#1e1c1a;--fg:#e8e4dc;--fg-soft:#9a9385;
  --gold:#d8b95e;--gold-deep:#B08D2E;--gold-light:#e8cc7a;
  --card:#1e1c1a;--line:#332e28;--muted:#6e6860;
  --ok:#5db86a;--warn:#e0a030;--over:#e05550;--tag-bg:#2a2622;
  --input-bg:#252320;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;max-width:640px;margin:0 auto}
h1{font-family:'Cinzel',Georgia,serif;font-weight:600;font-size:1.25rem;letter-spacing:0.04em;
  color:var(--gold);text-align:center;padding:16px 0 4px}
.sub{text-align:center;color:var(--muted);font-size:0.72rem;padding-bottom:12px;letter-spacing:0.02em}

/* Profile card */
.prof{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.prof h3{font-family:'Cinzel',Georgia,serif;font-size:0.8rem;font-weight:600;margin-bottom:8px}
.prof-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prof-row input[type=text]{flex:1;min-width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--input-bg);color:var(--fg);font-size:0.82rem}
.prof-row input[type=number]{width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--input-bg);color:var(--fg);font-size:0.82rem;text-align:right;font-variant-numeric:tabular-nums}
.prof-row .unit{font-size:0.75rem;color:var(--muted)}

/* Daily budget bar */
.budget{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.budget h3{font-family:'Cinzel',Georgia,serif;font-size:0.78rem;font-weight:600;margin-bottom:6px}
.budget-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bg-cell{text-align:center}
.bg-cell .lb{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:1px}
.bg-cell .vl{font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums}
.bg-cell .tg{font-size:0.6rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sok{color:var(--ok)}.swn{color:var(--warn)}.sov{color:var(--over)}

/* Meal slots */
.meal-slot{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.meal-hdr{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--bg-deep);border-bottom:1px solid var(--line)}
.meal-hdr h2{font-family:'Cinzel',Georgia,serif;font-size:0.82rem;font-weight:600}
.meal-hdr .mk{font-size:0.75rem;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.meal-body{padding:10px 12px}

/* Filters */
.filter-sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.pick-label{font-size:0.67rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin-bottom:3px;margin-top:8px}
.pick-label:first-child{margin-top:0}
.search-box{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--input-bg);
  color:var(--fg);font-size:0.82rem;margin-bottom:6px}
.search-box::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:4px 9px;border:1px solid var(--line);border-radius:14px;font-size:0.72rem;cursor:pointer;
  background:var(--bg);color:var(--fg-soft);transition:all 0.12s;user-select:none}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.chip:hover{border-color:var(--gold)}
.rcount{font-size:0.72rem;color:var(--muted);text-align:center;margin-bottom:8px}

/* Recipe cards */
.rc{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;cursor:pointer;transition:border-color 0.15s}
.rc:hover{border-color:var(--gold)}
.rc.expanded{border-color:var(--gold);cursor:default}
.rc.selected{border-color:var(--ok);border-width:2px}
.rc-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
.rc-head .rc-id{font-size:0.65rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-head .rc-name{flex:1;font-size:0.82rem;font-weight:600;color:var(--fg);min-width:0}
.rc-head .rc-arrow{font-size:0.7rem;color:var(--muted);transition:transform 0.2s}
.rc.expanded .rc-arrow{transform:rotate(90deg)}
.rc-tags{display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap}
.rc-tag{font-size:0.62rem;padding:2px 7px;border-radius:10px;background:var(--tag-bg);color:var(--fg-soft);letter-spacing:0.02em}
.rc-tag.prot{color:var(--gold-deep)}
.rc-tag.cuis{color:var(--gold)}

.rc-detail{border-top:1px solid var(--line);padding:0}
.rc-section{padding:8px 12px;border-bottom:1px solid var(--line)}
.rc-section:last-child{border-bottom:none}
.rc-section h4{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:4px}

/* Ingredient table in recipe detail */
.ing-tbl{width:100%;border-collapse:collapse;font-size:0.78rem}
.ing-tbl th{text-align:left;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);
  padding:3px 3px;border-bottom:1px solid var(--line);font-weight:500}
.ing-tbl th.r{text-align:right}
.ing-tbl td{padding:4px 3px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ing-tbl tr:last-child td{border-bottom:none}
.ing-tbl .fn{color:var(--fg)}
.ing-tbl .gm-cell{width:60px}
.ing-tbl .gm-input{width:52px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--input-bg);
  color:var(--gold);font-size:0.78rem;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ing-tbl .gm-input:focus{border-color:var(--gold);outline:none}
.ing-tbl .mv{text-align:right;color:var(--fg-soft);font-size:0.72rem}
.ing-tbl .tot td{font-weight:600;border-top:2px solid var(--line);color:var(--fg)}

.rc-steps{counter-reset:step;list-style:none;padding:0;font-size:0.78rem;color:var(--fg-soft);line-height:1.5}
.rc-steps li{counter-increment:step;padding:3px 0 3px 24px;position:relative}
.rc-steps li::before{content:counter(step)".";position:absolute;left:0;color:var(--gold);font-weight:600;font-size:0.72rem}

.rc-macros{display:flex;gap:12px;font-size:0.78rem;color:var(--fg-soft);padding:6px 0;flex-wrap:wrap}
.rc-macros .val{font-weight:600;color:var(--gold)}

.rc-src{font-size:0.68rem;color:var(--muted);padding:4px 12px 8px}
.rc-src a{color:var(--gold);text-decoration:none}
.rc-src a:hover{text-decoration:underline}

/* Action buttons */
.select-btn{padding:6px 14px;border:1px solid var(--gold);border-radius:6px;background:transparent;color:var(--gold);
  font-size:0.75rem;cursor:pointer;margin-top:6px;display:inline-block}
.select-btn:hover{background:var(--gold);color:#fff}
.select-btn.active{background:var(--ok);border-color:var(--ok);color:#fff}

.loading-msg{text-align:center;color:var(--muted);padding:30px 0;font-size:0.82rem}

/* Selected meals summary */
.sel-meals{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.sel-meals h3{font-family:'Cinzel',Georgia,serif;font-size:0.78rem;font-weight:600;margin-bottom:6px}
.sel-meal-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:0.78rem}
.sel-meal-item:last-child{border-bottom:none}
.sel-meal-item .nm{color:var(--fg);flex:1}
.sel-meal-item .mk{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:8px}
.sel-meal-item .rem-meal{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
  color:var(--muted);cursor:pointer;font-size:0.65rem;display:flex;align-items:center;justify-content:center;margin-left:6px;flex-shrink:0}
.sel-meal-item .rem-meal:hover{border-color:var(--over);color:var(--over)}

.foot{text-align:center;padding:8px 0 24px}
.foot button{padding:5px 18px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--muted);font-size:0.75rem;cursor:pointer}
.foot button:hover{border-color:var(--over);color:var(--over)}
</style>

<h1>AEVUM Meal Planner</h1>
<p class="sub">Activation Phase · Auto-Scaling Recipes</p>

<div class="prof" id="profCard"></div>
<div class="budget" id="budgetBar"></div>
<div class="sel-meals" id="selMeals" hidden></div>

<div class="filter-sec" id="filterSec"></div>
<div class="rcount" id="rcount"></div>
<div id="recipeList"></div>

<div class="foot"><button id="resetBtn">Reset all</button></div>

<script>
/* ===== CONFIG ===== */
let EAA_P = 36, EAA_K = 180;
const MAX_MEALS = 2;

/* ===== STATE ===== */
let profile = { name: "User", kg: 65, eaaP: 36, eaaK: 180 };
let selectedMeals = []; // [{recipeId, scaledIngredients: [{id, grams}]}]
let filtProt = null;
let filtCuis = null;
let searchQ = "";
let expandedR = null;

let DB_INGREDIENTS = [];
let DB_RECIPES = [];
let dbLoaded = false;
let dbCuisines = [];
let dbProteins = [];

/* Ingredient lookup map */
let ING_MAP = {};

/* ===== SOLVER ===== */
function calcTargets(kg) {
  const foodProt = Math.round(kg * 1.2) - profile.eaaP;
  const fp = Math.max(foodProt, 10);
  const totalProt = fp + profile.eaaP;
  const fat = 10;
  const carb = 30;
  const kcal = Math.round(totalProt * 4 + carb * 4 + fat * 9);
  return { prot: totalProt, carb, fat, kcal, foodProt: fp, mealProt: Math.round(fp / MAX_MEALS), eaaP: profile.eaaP, eaaK: profile.eaaK };
}

/* Compute macros for an ingredient at given grams */
function ingMacros(id, grams) {
  const ing = ING_MAP[id];
  if (!ing) return { p: 0, f: 0, c: 0, kcal: 0 };
  const m = ing.per100g;
  const r = grams / 100;
  return { p: m.p * r, f: m.f * r, c: m.c * r, kcal: m.kcal * r };
}

/* Compute total macros for a list of {id, grams} */
function recipeMacros(ingredients) {
  let p = 0, f = 0, c = 0, kcal = 0;
  ingredients.forEach(i => {
    const m = ingMacros(i.id, i.grams);
    p += m.p; f += m.f; c += m.c; kcal += m.kcal;
  });
  return { p, f, c, kcal };
}

/* Scale a recipe so its protein-category ingredients hit mealProt target */
function scaleRecipe(recipe, mealProt) {
  const ings = recipe.ingredients.map(i => ({ ...i }));
  // Sum protein from protein-category ingredients at base quantities
  let baseProt = 0;
  ings.forEach(i => {
    const ing = ING_MAP[i.id];
    if (ing && ing.category === "protein") {
      baseProt += ing.per100g.p * i.grams / 100;
    }
  });
  if (baseProt <= 0) return ings; // can't scale
  const factor = mealProt / baseProt;
  // Scale protein ingredients, keep everything else as-is
  return ings.map(i => {
    const ing = ING_MAP[i.id];
    if (ing && ing.category === "protein") {
      return { id: i.id, grams: Math.round(i.grams * factor) };
    }
    return { id: i.id, grams: i.grams };
  });
}

/* ===== PERSISTENCE ===== */
function load() {
  try {
    const s = localStorage.getItem("kv5");
    if (s) {
      const d = JSON.parse(s);
      if (d.profile) profile = d.profile;
      if (d.selectedMeals) selectedMeals = d.selectedMeals;
      if (d.filtProt) filtProt = d.filtProt;
      if (d.filtCuis) filtCuis = d.filtCuis;
      if (d.profile && d.profile.eaaP == null) { d.profile.eaaP = 36; d.profile.eaaK = 180; }
    }
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem("kv5", JSON.stringify({ profile, selectedMeals, filtProt, filtCuis }));
  } catch (e) {}
}

/* ===== DATA LOADING ===== */
async function loadData() {
  try {
    const [ingRes, recRes] = await Promise.all([
      fetch("ingredients.json"),
      fetch("recipes.json")
    ]);
    if (!ingRes.ok || !recRes.ok) throw new Error("fetch failed");
    DB_INGREDIENTS = await ingRes.json();
    DB_RECIPES = await recRes.json();
    // Build lookup
    DB_INGREDIENTS.forEach(i => { ING_MAP[i.id] = i; });
    dbCuisines = [...new Set(DB_RECIPES.map(r => r.cuisine))].sort();
    dbProteins = [...new Set(DB_RECIPES.map(r => r.protein))].sort();
    dbLoaded = true;
    renderAll();
  } catch (e) {
    console.error("Failed to load data:", e);
    document.getElementById("recipeList").innerHTML =
      '<p class="loading-msg">Could not load recipe database.</p>';
  }
}

/* ===== RENDER: PROFILE ===== */
function renderProfile() {
  document.getElementById("profCard").innerHTML = `<h3>Profile</h3>
    <div class="prof-row">
      <input type="text" value="${profile.name}" id="profName" placeholder="Name">
      <input type="number" value="${profile.kg}" id="profKg" min="30" max="200" step="1">
      <span class="unit">kg</span>
    </div>
    <div class="pick-label" style="margin-top:10px">EAA Supplement (per day)</div>
    <div class="prof-row">
      <span class="unit">Protein</span>
      <input type="number" value="${profile.eaaP}" id="profEaaP" min="0" max="100" step="1">
      <span class="unit">g</span>
      <span class="unit" style="margin-left:8px">Kcal</span>
      <input type="number" value="${profile.eaaK}" id="profEaaK" min="0" max="500" step="1">
      <span class="unit">kcal</span>
    </div>`;
  document.getElementById("profName").addEventListener("change", e => {
    profile.name = e.target.value; save(); renderBudget();
  });
  document.getElementById("profEaaP").addEventListener("change", e => {
    profile.eaaP = parseInt(e.target.value) || 0; save();
    const t2 = calcTargets(profile.kg);
    selectedMeals.forEach(sm => { const r = DB_RECIPES.find(x => x.id === sm.recipeId); if (r) sm.scaledIngredients = scaleRecipe(r, t2.mealProt); });
    save(); renderBudget(); renderSelectedMeals(); renderRecipes();
  });
  document.getElementById("profEaaK").addEventListener("change", e => {
    profile.eaaK = parseInt(e.target.value) || 0; save(); renderBudget();
  });
  document.getElementById("profKg").addEventListener("change", e => {
    profile.kg = parseInt(e.target.value) || 60;
    save();
    // Re-scale all selected meals
    const t = calcTargets(profile.kg);
    selectedMeals.forEach(sm => {
      const recipe = DB_RECIPES.find(r => r.id === sm.recipeId);
      if (recipe) sm.scaledIngredients = scaleRecipe(recipe, t.mealProt);
    });
    save();
    renderBudget(); renderSelectedMeals(); renderRecipes();
  });
}

/* ===== RENDER: DAILY BUDGET ===== */
function renderBudget() {
  const t = calcTargets(profile.kg);
  // Sum macros from selected meals
  let dayP = t.eaaP, dayC = 0, dayF = 0, dayK = t.eaaK;
  selectedMeals.forEach(sm => {
    const m = recipeMacros(sm.scaledIngredients);
    dayP += m.p; dayC += m.c; dayF += m.f; dayK += m.kcal;
  });
  dayK = dayP * 4 + dayC * 4 + dayF * 9;

  function stCl(v, g, tp) {
    const r = v / g;
    if (tp === "f") return r < 0.8 ? "swn" : r <= 1.05 ? "sok" : "sov";
    return r <= 0.9 ? "sok" : r <= 1.0 ? "swn" : "sov";
  }

  const cells = [
    ["Prot", Math.round(dayP), t.prot, "f"],
    ["Carb", Math.round(dayC), t.carb, "c"],
    ["Fat", (Math.round(dayF * 10) / 10) + "", t.fat, "c"],
    ["Kcal", Math.round(dayK), t.kcal, "c"],
  ];
  const eaaNote = `<div style="font-size:0.62rem;color:var(--muted);margin-top:4px;text-align:center">Includes EAA supplement: ${t.eaaP}g protein, ${t.eaaK} kcal</div>`;

  document.getElementById("budgetBar").innerHTML = `<h3>Daily Budget · ${profile.name} (${profile.kg}kg)</h3>
    <div class="budget-grid">${cells.map(([l, v, g, tp]) =>
      `<div class="bg-cell"><div class="lb">${l}</div><div class="vl ${stCl(parseFloat(v), g, tp)}">${v}</div><div class="tg">/ ${g}${l === "Kcal" ? "" : "g"}</div></div>`
    ).join("")}</div>${eaaNote}`;
}

/* ===== RENDER: SELECTED MEALS ===== */
function renderSelectedMeals() {
  const el = document.getElementById("selMeals");
  if (selectedMeals.length === 0) { el.hidden = true; return; }
  el.hidden = false;
  let h = `<h3>Today's Meals (${selectedMeals.length}/${MAX_MEALS})</h3>`;
  selectedMeals.forEach((sm, idx) => {
    const recipe = DB_RECIPES.find(r => r.id === sm.recipeId);
    const mac = recipeMacros(sm.scaledIngredients);
    h += `<div class="sel-meal-item">
      <span class="nm">${recipe ? recipe.name : sm.recipeId}</span>
      <span class="mk">${Math.round(mac.kcal)} kcal · P${Math.round(mac.p)}</span>
      <button class="rem-meal" data-idx="${idx}">✕</button>
    </div>`;
  });
  el.innerHTML = h;
  el.querySelectorAll(".rem-meal").forEach(b => {
    b.addEventListener("click", () => {
      selectedMeals.splice(parseInt(b.dataset.idx), 1);
      save(); renderBudget(); renderSelectedMeals(); renderRecipes();
    });
  });
}

/* ===== RENDER: FILTERS ===== */
function renderFilters() {
  if (!dbLoaded) {
    document.getElementById("filterSec").innerHTML = '<p class="loading-msg">Loading recipes...</p>';
    return;
  }
  let h = '<input type="text" class="search-box" id="searchBox" placeholder="Search recipes..." value="' + searchQ.replace(/"/g, '&quot;') + '">';
  h += `<div class="pick-label">Protein</div><div class="chips">`;
  dbProteins.forEach(pr => { h += `<span class="chip${filtProt === pr ? " on" : ""}" data-fp="${pr}">${pr}</span>`; });
  h += `</div><div class="pick-label">Cuisine</div><div class="chips">`;
  dbCuisines.forEach(cu => { h += `<span class="chip${filtCuis === cu ? " on" : ""}" data-fc="${cu}">${cu}</span>`; });
  h += `</div>`;
  document.getElementById("filterSec").innerHTML = h;
  document.getElementById("searchBox").addEventListener("input", e => {
    searchQ = e.target.value; expandedR = null; renderRecipes();
  });
  document.querySelectorAll("[data-fp]").forEach(c => c.addEventListener("click", () => {
    filtProt = filtProt === c.dataset.fp ? null : c.dataset.fp; expandedR = null; save(); renderFilters(); renderRecipes();
  }));
  document.querySelectorAll("[data-fc]").forEach(c => c.addEventListener("click", () => {
    filtCuis = filtCuis === c.dataset.fc ? null : c.dataset.fc; expandedR = null; save(); renderFilters(); renderRecipes();
  }));
}

/* ===== RENDER: RECIPE LIST ===== */
function renderRecipes() {
  if (!dbLoaded) {
    document.getElementById("recipeList").innerHTML = '<p class="loading-msg">Loading recipes...</p>';
    return;
  }
  const q = searchQ.toLowerCase();
  const t = calcTargets(profile.kg);
  const filtered = DB_RECIPES.filter(r => {
    if (filtProt && r.protein !== filtProt) return false;
    if (filtCuis && r.cuisine !== filtCuis) return false;
    if (q && !r.name.toLowerCase().includes(q) && !r.protein.toLowerCase().includes(q) && !r.cuisine.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("rcount").innerHTML = `${filtered.length} recipe${filtered.length === 1 ? "" : "s"} found <span style="font-size:0.65rem;opacity:0.7">· ${DB_RECIPES.length} total</span>`;

  const selectedIds = new Set(selectedMeals.map(s => s.recipeId));
  let html = "";
  filtered.forEach(rec => {
    const isExpanded = expandedR === rec.id;
    const isSelected = selectedIds.has(rec.id);
    // Compute scaled macros for preview
    const scaled = scaleRecipe(rec, t.mealProt);
    const mac = recipeMacros(scaled);

    html += `<div class="rc${isExpanded ? " expanded" : ""}${isSelected ? " selected" : ""}" data-rid="${rec.id}">`;
    html += `<div class="rc-head" data-rid="${rec.id}">
      <span class="rc-id">${rec.id}</span>
      <span class="rc-name">${rec.name}</span>
      <span class="rc-arrow">▸</span>
    </div>`;
    html += `<div class="rc-tags">
      <span class="rc-tag prot">${rec.protein}</span>
      <span class="rc-tag cuis">${rec.cuisine}</span>
      <span class="rc-tag">${Math.round(mac.kcal)} kcal</span>
      <span class="rc-tag">P${Math.round(mac.p)}g</span>
    </div>`;

    if (isExpanded) {
      // Use the saved scaled ingredients if selected, else compute fresh
      const mealEntry = selectedMeals.find(s => s.recipeId === rec.id);
      const displayIngs = mealEntry ? mealEntry.scaledIngredients : scaled;
      const displayMac = recipeMacros(displayIngs);

      html += `<div class="rc-detail">`;
      // Ingredients table with editable grams
      html += `<div class="rc-section"><h4>Ingredients (scaled for ${profile.kg}kg)</h4>
        <table class="ing-tbl">
          <tr><th>Ingredient</th><th class="r">Qty</th><th class="r">P</th><th class="r">C</th><th class="r">F</th></tr>`;
      displayIngs.forEach((ing, idx) => {
        const ingData = ING_MAP[ing.id];
        const name = ingData ? ingData.name : ing.id;
        const m = ingMacros(ing.id, ing.grams);
        html += `<tr>
          <td class="fn">${name}</td>
          <td class="gm-cell"><input type="number" class="gm-input" value="${ing.grams}" min="0" max="999" data-rid="${rec.id}" data-idx="${idx}">g</td>
          <td class="mv">${m.p.toFixed(1)}</td>
          <td class="mv">${m.c.toFixed(1)}</td>
          <td class="mv">${m.f.toFixed(1)}</td>
        </tr>`;
      });
      html += `<tr class="tot"><td>Total</td><td></td>
        <td class="mv">${displayMac.p.toFixed(1)}</td>
        <td class="mv">${displayMac.c.toFixed(1)}</td>
        <td class="mv">${displayMac.f.toFixed(1)}</td></tr>`;
      html += `</table></div>`;

      // Steps
      if (rec.steps && rec.steps.length) {
        html += `<div class="rc-section"><h4>Method</h4><ol class="rc-steps">`;
        rec.steps.forEach(step => { html += `<li>${step}</li>`; });
        html += `</ol></div>`;
      }

      // Macros summary
      html += `<div class="rc-section"><div class="rc-macros">
        <span><span class="val">${Math.round(displayMac.kcal)}</span> kcal</span>
        <span>P <span class="val">${displayMac.p.toFixed(1)}</span>g</span>
        <span>C <span class="val">${displayMac.c.toFixed(1)}</span>g</span>
        <span>F <span class="val">${displayMac.f.toFixed(1)}</span>g</span>
      </div></div>`;

      // Select / deselect button
      if (isSelected) {
        html += `<div class="rc-section"><button class="select-btn active" data-action="deselect" data-rid="${rec.id}">Selected as Meal</button></div>`;
      } else if (selectedMeals.length < MAX_MEALS) {
        html += `<div class="rc-section"><button class="select-btn" data-action="select" data-rid="${rec.id}">Add as Meal ${selectedMeals.length + 1}</button></div>`;
      }

      // Source
      if (rec.source) {
        try {
          html += `<p class="rc-src">Source: <a href="${rec.source}" target="_blank" rel="noopener">${new URL(rec.source).hostname.replace("www.", "")}</a></p>`;
        } catch (e) {
          html += `<p class="rc-src">Source: ${rec.source}</p>`;
        }
      }
      html += `</div>`;
    }
    html += `</div>`;
  });

  if (filtered.length === 0) {
    html = `<p style="text-align:center;color:var(--muted);padding:20px;font-size:0.82rem">No recipes match these filters</p>`;
  }
  document.getElementById("recipeList").innerHTML = html;

  // Bind expand/collapse
  document.querySelectorAll(".rc-head").forEach(h => {
    h.addEventListener("click", () => {
      const rid = h.dataset.rid;
      expandedR = expandedR === rid ? null : rid;
      renderRecipes();
    });
  });

  // Bind gram inputs
  document.querySelectorAll(".gm-input").forEach(inp => {
    inp.addEventListener("change", () => {
      const rid = inp.dataset.rid;
      const idx = parseInt(inp.dataset.idx);
      const newGrams = Math.max(0, parseInt(inp.value) || 0);
      // Update in selected meals if it's there
      const mealEntry = selectedMeals.find(s => s.recipeId === rid);
      if (mealEntry) {
        mealEntry.scaledIngredients[idx].grams = newGrams;
        save();
        renderBudget(); renderSelectedMeals(); renderRecipes();
      } else {
        // Just re-render this card with the new value
        renderRecipes();
      }
    });
    // Prevent card toggle on input click
    inp.addEventListener("click", e => e.stopPropagation());
  });

  // Bind select/deselect buttons
  document.querySelectorAll("[data-action=select]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const rid = btn.dataset.rid;
      const recipe = DB_RECIPES.find(r => r.id === rid);
      if (!recipe || selectedMeals.length >= MAX_MEALS) return;
      const scaled = scaleRecipe(recipe, t.mealProt);
      selectedMeals.push({ recipeId: rid, scaledIngredients: scaled });
      save(); renderBudget(); renderSelectedMeals(); renderRecipes();
    });
  });
  document.querySelectorAll("[data-action=deselect]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const rid = btn.dataset.rid;
      selectedMeals = selectedMeals.filter(s => s.recipeId !== rid);
      save(); renderBudget(); renderSelectedMeals(); renderRecipes();
    });
  });
}

/* ===== RENDER ALL ===== */
function renderAll() {
  renderProfile();
  renderBudget();
  renderSelectedMeals();
  renderFilters();
  renderRecipes();
}

/* ===== RESET ===== */
document.getElementById("resetBtn").addEventListener("click", () => {
  profile = { name: "User", kg: 65, eaaP: 36, eaaK: 180 };
  selectedMeals = [];
  filtProt = null; filtCuis = null; searchQ = ""; expandedR = null;
  save(); renderAll();
});

/* ===== INIT ===== */
load();
loadData();
renderProfile();
renderBudget();
</script>
