<!DOCTYPE html>
<!-- AEVUM Admin Dashboard · v2.0.0 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEVUM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1A1A1A;--ink-soft:#4a463f;--gold:#B08D2E;--gold-deep:#8f6f1f;
  --paper:#FBFAF7;--card:#ffffff;--line:#EBE5D8;--line-soft:#F2EDE2;--muted:#938c7d;
  --red:#A13024;--green:#2d6a4f;--blue:#4a6fa5;--sidebar-bg:#141311;--sidebar-w:220px;
  --serif:"Fraunces",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:13px;color:var(--ink);}
.hidden{display:none!important;}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center;}
.brand{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:.16em;}
.brand-sub{color:var(--gold);font-size:11px;letter-spacing:.28em;margin-top:6px;}
.login-box{margin-top:48px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;}
.login-box input{width:100%;padding:14px;background:#242320;border:1px solid #34322d;border-radius:12px;color:#fff;font-size:15px;text-align:center;letter-spacing:.04em;}
.login-box input::placeholder{color:#6b665c;}
.btn-login{padding:14px;background:var(--gold);color:var(--ink);border-radius:12px;font-size:15px;font-weight:600;transition:opacity .15s;}
.btn-login:hover{opacity:.9;}
.login-err{color:#e05c4d;font-size:13px;min-height:20px;}

/* LAYOUT */
#app{display:flex;height:100vh;}
#sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:#b7b1a4;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sb-brand{padding:22px 20px 18px;border-bottom:1px solid #2a2820;}
.sb-brand .mark{font-family:var(--serif);font-size:16px;color:#fff;letter-spacing:.14em;}
.sb-brand .sub{font-size:10px;color:var(--gold);letter-spacing:.2em;margin-top:3px;}
.sb-section{padding:16px 0 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6b665c;padding-left:20px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;cursor:pointer;transition:background .15s,color .15s;position:relative;}
.sb-item:hover{background:#1e1d1a;color:#e9e5dc;}
.sb-item.active{background:#2a2820;color:var(--gold);font-weight:600;}
.sb-item .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:none;position:absolute;right:16px;}
.sb-item.dirty .dot{display:block;}
.sb-count{font-size:11px;color:#6b665c;margin-left:auto;}
.sb-bottom{margin-top:auto;padding:16px 20px;border-top:1px solid #2a2820;}
.sb-logout{font-size:12px;color:#6b665c;cursor:pointer;transition:color .15s;}
.sb-logout:hover{color:var(--gold);}

/* MAIN */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar-admin{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10;}
.topbar-admin h1{font-family:var(--serif);font-size:20px;font-weight:500;}
.topbar-admin .meta{font-size:12px;color:var(--muted);margin-left:12px;}
.topbar-actions{display:flex;gap:8px;}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:opacity .15s;}
.btn-primary{background:var(--gold);color:var(--ink);}
.btn-primary:disabled{opacity:.4;cursor:default;}
.btn-secondary{background:var(--line);color:var(--ink-soft);}
.btn-danger{background:var(--red);color:#fff;}
.btn-outline{border:1px solid var(--line);color:var(--ink-soft);background:transparent;}
.btn:hover:not(:disabled){opacity:.85;}
.btn-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:4px 0;margin-right:16px;transition:color .15s;}
.btn-back:hover{color:var(--ink);}

/* TABLE */
.table-wrap{padding:20px 28px;flex:1;}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
thead th{background:#f5f2ec;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid var(--line);}
tbody td{padding:4px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
tbody tr:hover{background:#faf8f3;}
tbody td input,tbody td select{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;transition:border-color .15s,background .15s;}
tbody td input:focus,tbody td select:focus{border-color:var(--gold);background:var(--card);outline:none;}
tbody td textarea{width:100%;min-height:60px;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;resize:vertical;font-size:13px;line-height:1.4;}
tbody td textarea:focus{border-color:var(--gold);background:var(--card);outline:none;}
.row-actions{white-space:nowrap;}
.btn-del{color:var(--red);font-size:18px;padding:4px 8px;opacity:.5;transition:opacity .15s;}
.btn-del:hover{opacity:1;}
.col-narrow{width:70px;}
.col-mid{width:110px;}
.col-wide{min-width:200px;}

/* POLICY EDITOR */
.policy-cards{display:flex;flex-direction:column;gap:16px;padding:20px 28px;}
.policy-card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.policy-card h3{font-family:var(--serif);font-size:16px;margin-bottom:10px;text-transform:capitalize;}
.policy-card textarea{width:100%;min-height:200px;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.6;resize:vertical;}
.policy-card textarea:focus{border-color:var(--gold);outline:none;}

/* USERS TABLE */
.user-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.badge-program{background:#E8F2EF;color:var(--green);}
.badge-free{background:var(--line-soft);color:var(--muted);}
.user-row{cursor:pointer;transition:background .15s;}
.user-row:hover{background:#f5f0e5!important;}

/* USER DETAIL */
.ud-wrap{padding:24px 28px;display:flex;flex-direction:column;gap:20px;}
.ud-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.ud-stat{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.ud-stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;}
.ud-stat .value{font-family:var(--serif);font-size:22px;font-weight:500;}
.ud-stat .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.ud-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.ud-chart-card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.ud-chart-card h3{font-family:var(--serif);font-size:15px;font-weight:500;margin-bottom:12px;}
.ud-chart-card canvas{width:100%!important;max-height:240px;}
.ud-logs{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;}
.ud-logs h3{font-family:var(--serif);font-size:15px;font-weight:500;padding:16px 20px 12px;}
.ud-logs table{border-radius:0;box-shadow:none;}
.ud-logs tbody td{padding:8px 12px;font-size:13px;}
.ud-logs thead th{position:sticky;top:0;}
.ud-note{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help;}
.ud-meals{font-size:12px;color:var(--ink-soft);line-height:1.5;}
.ud-meal-item{display:flex;justify-content:space-between;gap:8px;padding:1px 0;}
.ud-meal-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ud-meal-kcal{color:var(--muted);white-space:nowrap;}

/* Tabs for log detail */
.ud-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);padding:0 20px;}
.ud-tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:color .15s;}
.ud-tab:hover{color:var(--ink);}
.ud-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* Export button */
.ud-export{display:flex;gap:8px;justify-content:flex-end;padding:0 0 8px;}

/* Responsive */
@media(max-width:900px){
  .ud-charts{grid-template-columns:1fr;}
  #sidebar{width:180px;}
}
@media(max-width:600px){
  #sidebar{display:none;}
  .ud-stats{grid-template-columns:1fr 1fr;}
}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:100;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.error{background:var(--red);}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state p{font-size:15px;margin-bottom:12px;}

/* Scrollable log table */
.ud-log-scroll{max-height:500px;overflow-y:auto;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="brand">AEVUM</div>
  <div class="brand-sub">ADMIN</div>
  <div class="login-box">
    <input type="text" id="tokenInput" placeholder="Admin token" autocomplete="off" spellcheck="false">
    <button class="btn-login" onclick="doLogin()">Sign in</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <nav id="sidebar">
    <div class="sb-brand">
      <div class="mark">AEVUM</div>
      <div class="sub">ADMIN</div>
    </div>
    <div class="sb-section">Reference tables</div>
    <div class="sb-item" data-table="rules" onclick="selectTable('rules')">Rules<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="foods" onclick="selectTable('foods')">Foods<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="policy" onclick="selectTable('policy')">Policy<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="config" onclick="selectTable('config')">Config<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-section">Content</div>
    <div class="sb-item" data-table="messages" onclick="selectTable('messages')">Messages<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="recipes" onclick="selectTable('recipes')">Recipes<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="movements" onclick="selectTable('movements')">Movements<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="workouts" onclick="selectTable('workouts')">Workouts<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-section">People</div>
    <div class="sb-item" data-table="users" onclick="selectTable('users')">Users<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-bottom">
      <span class="sb-logout" onclick="logout()">Sign out</span>
    </div>
  </nav>
  <div id="main">
    <div class="topbar-admin">
      <div style="display:flex;align-items:baseline;">
        <button class="btn-back hidden" id="btnBack" onclick="backToUsers()">&#8592; Users</button>
        <h1 id="tableTitle">Rules</h1>
        <span class="meta" id="tableMeta"></span>
      </div>
      <div class="topbar-actions" id="tableActions"></div>
    </div>
    <div id="tableContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://aevum-api-v2.marco-iannitto.workers.dev';
let TOKEN = '';
let activeTable = '';
let activeUserDetail = null; // holds loaded user detail data
let chartInstances = {};

// ─── Table definitions ───────────────────────────────────────
const TABLES = {
  rules: {
    cols: [
      { key:'phase', label:'Phase', w:'col-mid' },
      { key:'model', label:'Model', w:'col-mid' },
      { key:'metric', label:'Metric', w:'col-mid' },
      { key:'basis', label:'Basis', w:'col-narrow' },
      { key:'value', label:'Value', w:'col-narrow', type:'number' },
      { key:'green_lo', label:'Green Lo', w:'col-narrow', type:'number' },
      { key:'green_hi', label:'Green Hi', w:'col-narrow', type:'number' },
      { key:'amber_lo', label:'Amber Lo', w:'col-narrow', type:'number' },
      { key:'amber_hi', label:'Amber Hi', w:'col-narrow', type:'number' },
      { key:'gated', label:'Gated', w:'col-narrow' },
      { key:'unit', label:'Unit', w:'col-narrow' }
    ]
  },
  foods: {
    cols: [
      { key:'phase', label:'Phase', w:'col-mid' },
      { key:'category', label:'Category', w:'col-mid' },
      { key:'subcategory', label:'Subcategory', w:'col-mid' },
      { key:'item', label:'Item', w:'col-wide' },
      { key:'verdict', label:'Verdict', w:'col-narrow' },
      { key:'cap_g', label:'Cap (g)', w:'col-narrow', type:'number' },
      { key:'note', label:'Note', w:'col-wide' }
    ]
  },
  policy: { mode:'cards' },
  config: {
    cols: [
      { key:'key', label:'Key', w:'col-wide' },
      { key:'value', label:'Value', w:'col-wide' }
    ]
  },
  messages: {
    cols: [
      { key:'id', label:'ID', w:'col-mid' },
      { key:'trigger', label:'Trigger', w:'col-mid' },
      { key:'enabled', label:'Enabled', w:'col-narrow' },
      { key:'phase', label:'Phase', w:'col-narrow' },
      { key:'priority', label:'Pri', w:'col-narrow', type:'number' },
      { key:'title', label:'Title', w:'col-wide' },
      { key:'body', label:'Body', w:'col-wide' },
      { key:'badge', label:'Badge', w:'col-narrow' },
      { key:'frequency', label:'Freq', w:'col-mid' }
    ]
  },
  recipes: {
    cols: [
      { key:'name', label:'Name', w:'col-wide' },
      { key:'protein', label:'Protein', w:'col-mid' },
      { key:'cuisine', label:'Cuisine', w:'col-mid' },
      { key:'phase', label:'Phase', w:'col-narrow' },
      { key:'kcal', label:'Kcal', w:'col-narrow', type:'number' },
      { key:'protein_g', label:'Prot g', w:'col-narrow', type:'number' },
      { key:'fat_g', label:'Fat g', w:'col-narrow', type:'number' },
      { key:'carbs_g', label:'Carbs g', w:'col-narrow', type:'number' },
      { key:'ingredients', label:'Ingredients', w:'col-wide' },
      { key:'steps', label:'Steps', w:'col-wide' }
    ]
  },
  movements: {
    cols: [
      { key:'id', label:'ID', w:'col-mid' },
      { key:'name', label:'Name', w:'col-wide' },
      { key:'phase', label:'Phase', w:'col-narrow' },
      { key:'equipment', label:'Equip', w:'col-mid' },
      { key:'video_url', label:'Video URL', w:'col-wide' },
      { key:'cues', label:'Cues', w:'col-wide' },
      { key:'mistake', label:'Mistake', w:'col-wide' }
    ]
  },
  workouts: {
    cols: [
      { key:'workout_id', label:'Workout ID', w:'col-mid' },
      { key:'workout_name', label:'Name', w:'col-wide' },
      { key:'phase', label:'Phase', w:'col-narrow' },
      { key:'duration_min', label:'Min', w:'col-narrow', type:'number' },
      { key:'sort_order', label:'Order', w:'col-narrow', type:'number' },
      { key:'movement_id', label:'Movement', w:'col-mid' },
      { key:'sets', label:'Sets', w:'col-narrow', type:'number' },
      { key:'reps', label:'Reps', w:'col-narrow', type:'number' },
      { key:'rest_sec', label:'Rest s', w:'col-narrow', type:'number' }
    ]
  },
  users: { mode:'users' }
};

// ─── Data store ──────────────────────────────────────────────
const store = {};

// ─── API call ────────────────────────────────────────────────
async function api(action, data = {}) {
  const res = await fetch(API, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + TOKEN
    },
    body: JSON.stringify({ action, ...data })
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

// ─── Login ───────────────────────────────────────────────────
async function doLogin() {
  const inp = document.getElementById('tokenInput');
  const err = document.getElementById('loginErr');
  const token = inp.value.trim();
  if (!token) { err.textContent = 'Enter your admin token'; return; }
  TOKEN = token;
  try {
    await api('admin_users');
    sessionStorage.setItem('aevum_admin_token', token);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    selectTable('rules');
  } catch (e) {
    err.textContent = 'Invalid token or not admin';
    TOKEN = '';
  }
}

(function() {
  const saved = sessionStorage.getItem('aevum_admin_token');
  if (saved) {
    TOKEN = saved;
    api('admin_users').then(() => {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      selectTable('rules');
    }).catch(() => { TOKEN = ''; sessionStorage.removeItem('aevum_admin_token'); });
  }
  document.getElementById('tokenInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
})();

// ─── Table selection ─────────────────────────────────────────
async function selectTable(name) {
  activeTable = name;
  activeUserDetail = null;
  document.getElementById('btnBack').classList.add('hidden');
  document.querySelectorAll('.sb-item').forEach(el => {
    el.classList.toggle('active', el.dataset.table === name);
  });
  document.getElementById('tableTitle').textContent = name.charAt(0).toUpperCase() + name.slice(1);

  if (!store[name]) {
    document.getElementById('tableContent').innerHTML = '<div class="empty-state"><p>Loading...</p></div>';
    try {
      await loadTable(name);
    } catch (e) {
      document.getElementById('tableContent').innerHTML = '<div class="empty-state"><p>Error: ' + e.message + '</p></div>';
      return;
    }
  }
  renderView(name);
}

async function loadTable(name) {
  let rows;
  if (name === 'users') {
    const res = await api('admin_users');
    rows = res.users || [];
  } else {
    const res = await api('admin_list', { table: name });
    rows = res.rows || [];
  }
  store[name] = { original: structuredClone(rows), current: rows, dirty: false };
  updateCount(name);
}

function updateCount(name) {
  const el = document.querySelector(`.sb-item[data-table="${name}"] .sb-count`);
  if (el && store[name]) el.textContent = store[name].current.length;
}

function markDirty(name) {
  store[name].dirty = true;
  const el = document.querySelector(`.sb-item[data-table="${name}"]`);
  if (el) el.classList.add('dirty');
  renderActions(name);
}

function markClean(name) {
  store[name].dirty = false;
  const el = document.querySelector(`.sb-item[data-table="${name}"]`);
  if (el) el.classList.remove('dirty');
  renderActions(name);
}

// ─── Render ──────────────────────────────────────────────────
function renderView(name) {
  const def = TABLES[name];
  if (def.mode === 'cards') renderPolicyCards(name);
  else if (def.mode === 'users') renderUsersTable(name);
  else renderDataTable(name);
  renderActions(name);
}

function renderActions(name) {
  const acts = document.getElementById('tableActions');
  const def = TABLES[name];
  const d = store[name];
  const meta = document.getElementById('tableMeta');

  if (activeUserDetail) {
    meta.textContent = '';
    acts.innerHTML = '<button class="btn btn-outline" onclick="exportUserCSV()">Export CSV</button>';
    return;
  }

  meta.textContent = d ? d.current.length + ' rows' : '';

  if (def.mode === 'users') {
    acts.innerHTML = '<button class="btn btn-secondary" onclick="refreshTable(\'' + name + '\')">Refresh</button>';
    return;
  }

  const dirty = d && d.dirty;
  acts.innerHTML = `
    <button class="btn btn-secondary" onclick="addRow('${name}')">+ Add row</button>
    <button class="btn btn-secondary" onclick="revertTable('${name}')" ${dirty ? '' : 'disabled'}>Revert</button>
    <button class="btn btn-primary" onclick="saveTable('${name}')" ${dirty ? '' : 'disabled'}>Save changes</button>
  `;
}

function renderDataTable(name) {
  const def = TABLES[name];
  const rows = store[name].current;
  const wrap = document.getElementById('tableContent');

  let html = '<div class="table-wrap"><table><thead><tr>';
  for (const col of def.cols) {
    html += `<th class="${col.w || ''}">${col.label}</th>`;
  }
  html += '<th></th></tr></thead><tbody>';

  for (let i = 0; i < rows.length; i++) {
    html += '<tr>';
    for (const col of def.cols) {
      const val = rows[i][col.key] ?? '';
      const inputType = col.type === 'number' ? 'number' : 'text';
      html += `<td class="${col.w || ''}"><input type="${inputType}" value="${esc(String(val))}" data-row="${i}" data-col="${col.key}" onchange="cellChange(this,'${name}')"></td>`;
    }
    html += `<td class="row-actions"><button class="btn-del" onclick="delRow('${name}',${i})" title="Delete row">&times;</button></td>`;
    html += '</tr>';
  }

  if (!rows.length) {
    html += `<tr><td colspan="${def.cols.length + 1}" style="text-align:center;padding:30px;color:var(--muted);">No rows. Click "+ Add row" to start.</td></tr>`;
  }

async function openUser(userId) {
  document.getElementById('tableContent').innerHTML = '<div class="empty-state"><p>Loading user data...</p></div>';
  document.getElementById('btnBack').classList.remove('hidden');

  try {
    const data = await api('admin_export', { id: userId });
    activeUserDetail = data;
    activeUserDetail._userId = userId;

    const profile = data.profile || {};
    document.getElementById('tableTitle').textContent = profile.name || userId;
    document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));

    renderUserDetail(data);
    renderActions('users');
  } catch (e) {
    document.getElementById('tableContent').innerHTML = '<div class="empty-state"><p>Error: ' + e.message + '</p></div>';
  }
}

function backToUsers() {
  destroyCharts();
  activeUserDetail = null;
  selectTable('users');
}

function destroyCharts() {
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch {} });
  chartInstances = {};
}

function renderUserDetail(data) {
  const profile = data.profile || {};
  const logs = data.logs || [];
  const wrap = document.getElementById('tableContent');

  // Parse day_json for each log
  const parsed = logs.map(l => {
    let dj = {};
    if (l.day_json) {
      try { dj = typeof l.day_json === 'string' ? JSON.parse(l.day_json) : l.day_json; } catch {}
    }
    return { ...l, _dj: dj };
  });

  // Compute stats
  const withWeight = parsed.filter(l => l.weight > 0);
  const withKcal = parsed.filter(l => l.kcal > 0);
  const latestWeight = withWeight.length ? withWeight[withWeight.length - 1].weight : null;
  const startWeight = profile.start_weight || (withWeight.length ? withWeight[0].weight : null);
  const weightChange = (startWeight && latestWeight) ? (latestWeight - startWeight).toFixed(1) : null;
  const avgKcal = withKcal.length ? Math.round(withKcal.reduce((a, l) => a + l.kcal, 0) / withKcal.length) : null;
  const totalDays = logs.length;
  const lastDay = logs.length ? logs[logs.length - 1].day : 0;

  // Compliance: days with kcal logged
  const daysWithData = parsed.filter(l => l.kcal > 0 || l.weight > 0).length;
  const compliance = lastDay > 0 ? Math.round(daysWithData / lastDay * 100) : 0;

  // Average macros
  const avgProtein = withKcal.length ? Math.round(withKcal.reduce((a, l) => a + (l.protein || 0), 0) / withKcal.length) : null;
  const avgFat = withKcal.length ? Math.round(withKcal.reduce((a, l) => a + (l.fat || 0), 0) / withKcal.length) : null;
  const avgCarbs = withKcal.length ? Math.round(withKcal.reduce((a, l) => a + (l.carbs || 0), 0) / withKcal.length) : null;

  const isProg = !!profile.program;
  let html = '<div class="ud-wrap">';

  // ─── Profile bar ───
  html += `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="user-badge ${isProg ? 'badge-program' : 'badge-free'}" id="udBadge">${isProg ? 'Program' : 'Free'}</span>
      <button class="btn ${isProg ? 'btn-outline' : 'btn-primary'}" id="udToggleBtn" onclick="toggleProgram()" style="font-size:12px;padding:6px 12px;">
        ${isProg ? 'Switch to Free' : 'Activate Program'}
      </button>
    </div>
    <span style="font-size:12px;color:var(--muted);">${profile.email || ''}</span>
    <span style="font-size:12px;color:var(--muted);">ID: ${activeUserDetail._userId}</span>
    <span style="font-size:12px;color:var(--muted);">Start: ${profile.start_date || '-'}</span>
  </div>`;

  // ─── Editable fields row ───
  html += `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px;">
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;">
      Activation days:
      <input type="number" id="udActDays" value="${profile.activation_days || ''}" min="1" max="90"
        style="width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--fg);font-size:12px;">
    </label>
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;">
      Target kcal:
      <input type="number" id="udTargetKcal" value="${profile.current_target_kcal || ''}" min="800" max="5000" step="50"
        style="width:80px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--fg);font-size:12px;">
    </label>
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;">
      Target kg:
      <input type="number" id="udTargetKg" value="${profile.target_kg || ''}" min="30" max="200" step="0.1"
        style="width:80px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--fg);font-size:12px;">
    </label>
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;">
      Sex:
      <select id="udSex" style="padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--fg);font-size:12px;">
        <option value="m" ${profile.sex === 'm' ? 'selected' : ''}>Male</option>
        <option value="f" ${profile.sex === 'f' ? 'selected' : ''}>Female</option>
      </select>
    </label>
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;">
      DOB:
      <input type="date" id="udDob" value="${profile.dob || ''}"
        style="padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--fg);font-size:12px;">

      Height (cm):
      <input type="number" id="udHeight" value="${profile.height || ''}" min="100" max="250"
        style="width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--fg);font-size:12px;">
    </label>
    <button class="btn btn-primary" onclick="saveUserFields()" style="font-size:12px;padding:4px 12px;">Save</button>
  </div>`;

  // ─── Stats row ───
  html += '<div class="ud-stats">';
  html += statCard('Current weight', latestWeight ? latestWeight + ' kg' : '-', weightChange !== null ? (weightChange > 0 ? '+' : '') + weightChange + ' kg from start' : '');
  html += statCard('Start weight', startWeight ? startWeight + ' kg' : '-', profile.target_kg ? 'Target: ' + profile.target_kg + ' kg' : '');
  html += statCard('Avg calories', avgKcal ? avgKcal.toLocaleString() + ' kcal' : '-', profile.current_target_kcal ? 'Target: ' + profile.current_target_kcal : '');
  html += statCard('Days logged', daysWithData + ' / ' + lastDay, compliance + '% compliance');
  html += statCard('Avg protein', avgProtein ? avgProtein + ' g' : '-', '');
  html += statCard('Avg fat / carbs', (avgFat || '-') + ' / ' + (avgCarbs || '-') + ' g', '');
  html += '</div>';

  // ─── Charts ───
  html += '<div class="ud-charts">';

  html += '<div class="ud-chart-card"><h3>Calories</h3><canvas id="chartKcal"></canvas></div>';
  html += '</div>';

  // ─── Tabs ───
  html += `<div class="ud-logs">
    <div class="ud-tabs">
      <div class="ud-tab active" data-tab="logs" onclick="switchLogTab(this,'logs')">Daily logs</div>
      <div class="ud-tab" data-tab="meals" onclick="switchLogTab(this,'meals')">Meals</div>
      <div class="ud-tab" data-tab="notes" onclick="switchLogTab(this,'notes')">Notes</div>
      <div class="ud-tab" data-tab="vitals" onclick="switchLogTab(this,'vitals')">Vitals</div>
    </div>
    <div class="ud-log-scroll" id="logTabContent"></div>
  </div>`;

  html += '</div>';
  wrap.innerHTML = html;

  // Render charts
  destroyCharts();
  renderWeightChart(parsed);
  renderKcalChart(parsed);

  // Render default tab
  renderLogTab('logs', parsed);
}

function statCard(label, value, sub) {
  return `<div class="ud-stat"><div class="label">${label}</div><div class="value">${value}</div>${sub ? '<div class="sub">' + sub + '</div>' : ''}</div>`;
}

// ─── Charts ───
function renderWeightChart(parsed) {
  const pts = parsed.filter(l => l.weight > 0);
  if (!pts.length) return;

  const ctx = document.getElementById('chartWeight');
  if (!ctx) return;

  chartInstances.weight = new Chart(ctx, {
    type: 'line',
    data: {
      labels: pts.map(p => 'D' + p.day),
      datasets: [{
        label: 'Weight (kg)',
        data: pts.map(p => p.weight),
        borderColor: '#B08D2E',
        backgroundColor: 'rgba(176,141,46,0.08)',
        fill: true,
        tension: 0.3,
        pointRadius: pts.length > 20 ? 1 : 3,
        pointHoverRadius: 5,
        borderWidth: 2
      }]
    },
    options: chartOpts('kg')
  });
}

function renderKcalChart(parsed) {
  const pts = parsed.filter(l => l.kcal > 0);
  if (!pts.length) return;

  const ctx = document.getElementById('chartKcal');
  if (!ctx) return;

  const target = activeUserDetail.profile ? activeUserDetail.profile.current_target_kcal : null;

  const datasets = [{
    label: 'Calories',
    data: pts.map(p => p.kcal),
    borderColor: '#4a6fa5',
    backgroundColor: 'rgba(74,111,165,0.08)',
    fill: true,
    tension: 0.3,
    pointRadius: pts.length > 20 ? 1 : 3,
    pointHoverRadius: 5,
    borderWidth: 2
  }];

  if (target) {
    datasets.push({
      label: 'Target',
      data: pts.map(() => target),
      borderColor: 'rgba(161,48,36,0.4)',
      borderDash: [6, 4],
      pointRadius: 0,
      borderWidth: 1.5,
      fill: false
    });
  }

  chartInstances.kcal = new Chart(ctx, {
    type: 'line',
    data: {
      labels: pts.map(p => 'D' + p.day),
      datasets
    },
    options: chartOpts('kcal')
  });
}

function chartOpts(unit) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1A1A1A',
        titleFont: { size: 12 },
        bodyFont: { size: 12 },
        padding: 10,
        cornerRadius: 8,
        callbacks: {
          label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y + (unit === 'kg' ? ' kg' : ' kcal')
        }
      }
    },
    scales: {
      x: {
        ticks: { font: { size: 10 }, color: '#938c7d', maxTicksLimit: 15 },
        grid: { display: false }
      },
      y: {
        ticks: { font: { size: 10 }, color: '#938c7d' },
        grid: { color: 'rgba(235,229,216,0.5)' }
      }
    }
  };
}

// ─── CSV Export ───
function exportUserCSV() {
  if (!activeUserDetail) return;
  const logs = activeUserDetail.logs || [];
  const profile = activeUserDetail.profile || {};

  const headers = ['day','date','phase','weight','waist','serum_am','serum_pm','kcal','protein','fat','carbs','water_ml','exercise','exercise_kcal','energy','hunger','sleep','notes','meals'];
  let csv = headers.join(',') + '\n';

  for (const l of logs) {
    let dj = {};
    if (l.day_json) { try { dj = JSON.parse(l.day_json); } catch {} }
    const meals = (dj.meals || dj.m || []).map(m => (m.name || m.n || '') + ':' + (m.kcal || m.k || '')).join('; ');

    const row = [
      l.day, csvVal(l.date), csvVal(l.phase), l.weight || '', l.waist || '',
      csvVal(l.serum_am), csvVal(l.serum_pm),
      l.kcal || '', l.protein || '', l.fat || '', l.carbs || '', l.water_ml || '',
      csvVal(l.exercise), l.exercise_kcal || '',
      csvVal(l.energy), csvVal(l.hunger), csvVal(l.sleep),
      csvVal(l.notes), csvVal(meals)
    ];
    csv += row.join(',') + '\n';
  }

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (profile.name || 'user').replace(/\s+/g, '_') + '_export.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

function csvVal(v) {
  if (v === null || v === undefined || v === '') return '';
  const s = String(v);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

// ─── Toggle program status ──────────────────────────────────
async function toggleProgram() {
  if (!activeUserDetail) return;
  const profile = activeUserDetail.profile || {};
  const newVal = profile.program ? 0 : 1;
  const label = newVal ? 'Program' : 'Free';
  if (!confirm('Switch this user to "' + label + '"?')) return;
  try {
    await api('admin_update_user', { id: activeUserDetail._userId, program: newVal });
    toast('User set to ' + label);
    // Refresh user detail
    delete store.users;
    await openUser(activeUserDetail._userId);
  } catch (e) {
    toast('Error: ' + e.message, true);
  }
}

async function saveUserFields() {
  if (!activeUserDetail) return;
  const updates = {};
  const actDays = document.getElementById('udActDays').value;
  const targetKcal = document.getElementById('udTargetKcal').value;
  const targetKg = document.getElementById('udTargetKg').value;
  const sex = document.getElementById('udSex').value;
  const dob = document.getElementById('udDob').value;
  const height = document.getElementById('udHeight').value;
  if (actDays !== '') updates.activation_days = parseInt(actDays);
  if (targetKcal !== '') updates.current_target_kcal = parseInt(targetKcal);
  if (targetKg !== '') updates.target_kg = parseFloat(targetKg);
  updates.sex = sex;
  if (dob) updates.dob = dob;
  if (height !== '') updates.height = parseInt(height);
  if (!Object.keys(updates).length) { toast('Nothing to save'); return; }
  try {
    updates.id = activeUserDetail._userId;
    await api('admin_update_user', updates);
    toast('Saved');
    delete store.users;
    await openUser(activeUserDetail._userId);
  } catch (e) {
    toast('Error: ' + e.message, true);
  }
}

// ─── Cell editing ────────────────────────────────────────────
function cellChange(input, name) {
  const row = parseInt(input.dataset.row);
  const col = input.dataset.col;
  let val = input.value;
  const def = TABLES[name].cols.find(c => c.key === col);
  if (def && def.type === 'number') {
    val = val === '' ? null : parseFloat(val);
    if (isNaN(val)) val = null;
  }
  store[name].current[row][col] = val;
  markDirty(name);
}

function policyChange(textarea, name) {
  const phase = textarea.dataset.phase;
  const rows = store[name].current;
  let row = rows.find(r => r.phase === phase);
  if (!row) {
    row = { phase, rules_text: '' };
    rows.push(row);
  }
  row.rules_text = textarea.value;
  markDirty(name);
}

// ─── Row operations ──────────────────────────────────────────
function addRow(name) {
  const def = TABLES[name];
  if (def.mode === 'cards') { toast('All phases already shown'); return; }
  const row = {};
  for (const col of def.cols) {
    row[col.key] = col.type === 'number' ? null : '';
  }
  store[name].current.push(row);
  markDirty(name);
  renderView(name);
  const main = document.getElementById('main');
  setTimeout(() => main.scrollTop = main.scrollHeight, 50);
}

function delRow(name, idx) {
  store[name].current.splice(idx, 1);
  markDirty(name);
  renderView(name);
}

// ─── Save / Revert ───────────────────────────────────────────
async function saveTable(name) {
  const rows = store[name].current;
  const hasAutoPK = !['config'].includes(name);
  const cleanRows = rows.map(r => {
    const copy = { ...r };
    for (const k of Object.keys(copy)) {
      if (copy[k] === null || copy[k] === undefined) delete copy[k];
    }
    if (hasAutoPK && typeof copy.id === 'number') delete copy.id;
    return copy;
  }).filter(r => Object.keys(r).length > 0);

  try {
    await api('admin_seed', { table: name, rows: cleanRows });
    await loadTable(name);
    markClean(name);
    renderView(name);
    toast('Saved ' + cleanRows.length + ' rows to ' + name);
  } catch (e) {
    toast('Error: ' + e.message, true);
  }
}

async function revertTable(name) {
  store[name].current = structuredClone(store[name].original);
  markClean(name);
  renderView(name);
  toast('Reverted ' + name);
}

async function refreshTable(name) {
  delete store[name];
  await selectTable(name);
  toast('Refreshed ' + name);
}

// ─── Helpers ─────────────────────────────────────────────────
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2500);
}

// ─── Keyboard shortcut ──────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (activeTable && store[activeTable] && store[activeTable].dirty) {
      saveTable(activeTable);
    }
  }
});

// ─── Logout ─────────────────────────────────────────────────
function logout() {
  TOKEN = '';
  sessionStorage.removeItem('aevum_admin_token');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('tokenInput').value = '';
  Object.keys(store).forEach(k => delete store[k]);
  destroyCharts();
}
</script>
