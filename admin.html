<!DOCTYPE html>
<!-- AEVUM Admin Dashboard · v2.0.1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEVUM Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#1A1A1A;--ink-soft:#4a463f;--gold:#B08D2E;--gold-deep:#8f6f1f;
  --paper:#FBFAF7;--card:#ffffff;--line:#EBE5D8;--line-soft:#F2EDE2;--muted:#938c7d;
  --red:#A13024;--green:#2d6a4f;--blue:#4a6fa5;--sidebar-bg:#141311;--sidebar-w:220px;
  --serif:"Fraunces",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:13px;color:var(--ink);}
.hidden{display:none!important;}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center;}
.brand{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:.16em;}
.brand-sub{color:var(--gold);font-size:11px;letter-spacing:.28em;margin-top:6px;}
.login-box{margin-top:48px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;}
.login-box input{width:100%;padding:14px;background:#242320;border:1px solid #34322d;border-radius:12px;color:#fff;font-size:15px;text-align:center;letter-spacing:.04em;}
.login-box input::placeholder{color:#6b665c;}
.btn-login{padding:14px;background:var(--gold);color:var(--ink);border-radius:12px;font-size:15px;font-weight:600;transition:opacity .15s;}
.btn-login:hover{opacity:.9;}
.login-err{color:#e05c4d;font-size:13px;min-height:20px;}

/* LAYOUT */
#app{display:flex;height:100vh;}
#sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:#b7b1a4;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sb-brand{padding:22px 20px 18px;border-bottom:1px solid #2a2820;}
.sb-brand .mark{font-family:var(--serif);font-size:16px;color:#fff;letter-spacing:.14em;}
.sb-brand .sub{font-size:10px;color:var(--gold);letter-spacing:.2em;margin-top:3px;}
.sb-section{padding:16px 0 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6b665c;padding-left:20px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;cursor:pointer;transition:background .15s,color .15s;position:relative;}
.sb-item:hover{background:#1e1d1a;color:#e9e5dc;}
.sb-item.active{background:#2a2820;color:var(--gold);font-weight:600;}
.sb-item .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:none;position:absolute;right:16px;}
.sb-item.dirty .dot{display:block;}
.sb-count{font-size:11px;color:#6b665c;margin-left:auto;}
.sb-bottom{margin-top:auto;padding:16px 20px;border-top:1px solid #2a2820;}
.sb-logout{font-size:12px;color:#6b665c;cursor:pointer;transition:color .15s;}
.sb-logout:hover{color:var(--gold);}

/* MAIN */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar-admin{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10;}
.topbar-admin h1{font-family:var(--serif);font-size:20px;font-weight:500;}
.topbar-admin .meta{font-size:12px;color:var(--muted);margin-left:12px;}
.topbar-actions{display:flex;gap:8px;}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:opacity .15s;}
.btn-primary{background:var(--gold);color:var(--ink);}
.btn-primary:disabled{opacity:.4;cursor:default;}
.btn-secondary{background:var(--line);color:var(--ink-soft);}
.btn-danger{background:var(--red);color:#fff;}
.btn-outline{border:1px solid var(--line);color:var(--ink-soft);background:transparent;}
.btn:hover:not(:disabled){opacity:.85;}
.btn-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:4px 0;margin-right:16px;transition:color .15s;}
.btn-back:hover{color:var(--ink);}

/* TABLE */
.table-wrap{padding:20px 28px;flex:1;overflow:auto;}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
thead th{background:#f5f2ec;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:2;overflow:hidden;text-overflow:ellipsis;}
thead th.sticky-col{position:sticky;left:0;z-index:3;background:#f5f2ec;}
tbody td{padding:4px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
tbody td.sticky-col{position:sticky;left:0;z-index:1;background:var(--card);}
tbody tr:hover td.sticky-col{background:#faf8f3;}
tbody tr:hover{background:#faf8f3;}
tbody td input,tbody td select{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;transition:border-color .15s,background .15s;}
tbody td input:focus,tbody td select:focus{border-color:var(--gold);background:var(--card);outline:none;}
tbody td textarea{width:100%;min-height:60px;padding:6px 8px;border:1px solid transparent;border-radius:6px;background:transparent;resize:vertical;font-size:13px;line-height:1.4;}
tbody td textarea:focus{border-color:var(--gold);background:var(--card);outline:none;}
.row-actions{white-space:nowrap;}
.btn-del{color:var(--red);font-size:18px;padding:4px 8px;opacity:.5;transition:opacity .15s;}
.btn-del:hover{opacity:1;}
.col-narrow{width:70px;min-width:70px;}
.col-mid{width:110px;min-width:110px;}
.col-wide{min-width:200px;}
/* Resizable column handle */
th .col-resize{position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;user-select:none;}
th{position:relative;}

/* POLICY EDITOR */
.policy-cards{display:flex;flex-direction:column;gap:16px;padding:20px 28px;}
.policy-card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.policy-card h3{font-family:var(--serif);font-size:16px;margin-bottom:10px;text-transform:capitalize;}
.policy-card textarea{width:100%;min-height:200px;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.6;resize:vertical;}
.policy-card textarea:focus{border-color:var(--gold);outline:none;}

/* USERS TABLE */
.user-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.badge-program{background:#E8F2EF;color:var(--green);}
.badge-free{background:var(--line-soft);color:var(--muted);}
.user-row{cursor:pointer;transition:background .15s;}
.user-row:hover{background:#f5f0e5!important;}

/* USER DETAIL */
.ud-wrap{padding:24px 28px;display:flex;flex-direction:column;gap:20px;}
.ud-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.ud-stat{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.ud-stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;}
.ud-stat .value{font-family:var(--serif);font-size:22px;font-weight:500;}
.ud-stat .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.ud-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.ud-chart-card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.ud-chart-card h3{font-family:var(--serif);font-size:15px;font-weight:500;margin-bottom:12px;}
.ud-chart-card canvas{width:100%!important;max-height:240px;}
.ud-logs{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;}
.ud-logs h3{font-family:var(--serif);font-size:15px;font-weight:500;padding:16px 20px 12px;}
.ud-logs table{border-radius:0;box-shadow:none;}
.ud-logs tbody td{padding:8px 12px;font-size:13px;}
.ud-logs thead th{position:sticky;top:0;}
.ud-note{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help;}
.ud-meals{font-size:12px;color:var(--ink-soft);line-height:1.5;}
.ud-meal-item{display:flex;justify-content:space-between;gap:8px;padding:1px 0;}
.ud-meal-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ud-meal-kcal{color:var(--muted);white-space:nowrap;}

/* Tabs for log detail */
.ud-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);padding:0 20px;}
.ud-tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:color .15s;}
.ud-tab:hover{color:var(--ink);}
.ud-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* Export button */
.ud-export{display:flex;gap:8px;justify-content:flex-end;padding:0 0 8px;}

/* Responsive */
@media(max-width:900px){
  .ud-charts{grid-template-columns:1fr;}
  #sidebar{width:180px;}
}
@media(max-width:600px){
  #sidebar{display:none;}
  .ud-stats{grid-template-columns:1fr 1fr;}
}

/* INTAKES */
.intake-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:capitalize;}
.badge-draft{background:var(--line-soft);color:var(--muted);}
.badge-sent{background:#D4EDFF;color:#0C5285;}
.badge-in_progress{background:#FFF3CD;color:#856404;}
.badge-submitted{background:#E8F2EF;color:var(--green);}
.badge-review_required{background:#F8D7DA;color:var(--red);}
.badge-approved{background:rgba(176,141,46,.12);color:var(--gold-deep);}
.intake-row{cursor:pointer;transition:background .15s;}
.intake-row:hover{background:#f5f0e5!important;}
.intake-detail{padding:24px 28px;display:flex;flex-direction:column;gap:20px;}
.intake-section{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.intake-section h3{font-family:var(--serif);font-size:16px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.intake-field{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
.intake-field:last-child{border-bottom:none;}
.intake-field .if-label{width:160px;flex-shrink:0;color:var(--muted);font-size:12px;}
.intake-field .if-value{flex:1;font-weight:500;}
.intake-form{padding:24px 28px;}
.intake-form h2{font-family:var(--serif);font-size:20px;margin-bottom:20px;}
.if-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.if-grid .if-full{grid-column:1/-1;}
.if-group label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.if-group input,.if-group select,.if-group textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--card);}
.if-group input:focus,.if-group select:focus,.if-group textarea:focus{border-color:var(--gold);outline:none;}
.if-group textarea{min-height:80px;resize:vertical;}
.if-actions{display:flex;gap:10px;margin-top:20px;}
.link-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px;display:flex;flex-direction:column;gap:10px;}
.link-url{font-family:monospace;font-size:13px;word-break:break-all;padding:10px;background:var(--paper);border-radius:6px;border:1px solid var(--line-soft);}
.link-btns{display:flex;gap:8px;flex-wrap:wrap;}
.intake-status-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
@media(max-width:600px){.if-grid{grid-template-columns:1fr;}}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:100;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.error{background:var(--red);}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state p{font-size:15px;margin-bottom:12px;}

/* Scrollable log table */
.ud-log-scroll{max-height:500px;overflow-y:auto;}

/* MEAL PLAN BUILDER */
.mp-wrap{padding:20px;}
.mp-calendar{padding:8px 0 16px;}
.mp-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mp-cal-nav button{background:none;border:1px solid var(--line-soft);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--text);}
.mp-cal-nav button:hover{background:var(--line-soft);}
.mp-cal-nav span{font-weight:600;font-size:14px;}
.mp-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.mp-cal-hdr{text-align:center;font-size:10px;font-weight:600;color:var(--muted);padding:4px 0;text-transform:uppercase;}
.mp-day{padding:4px 2px;text-align:center;border-radius:6px;cursor:pointer;font-size:11px;transition:all .15s;border:2px solid transparent;position:relative;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.mp-day:hover{background:var(--line-soft);}
.mp-day.active{border-color:var(--gold);background:var(--card);font-weight:600;}
.mp-day.today{box-shadow:inset 0 0 0 1px var(--gold);}
.mp-day.outside{opacity:.3;pointer-events:none;}
.mp-day .mp-d-num{font-weight:600;font-size:13px;}
.mp-day .mp-d-prog{font-size:8px;color:var(--muted);}
.mp-day.has-meals::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--gold);}
.mp-phase-label{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-bottom:2px;font-weight:600;}
.mp-cal-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:10px;}
.ph-loading{background:#E8D5E0;color:#7B2D5F;}
.ph-activation{background:#E8F2EF;color:var(--green);}
.ph-transition{background:#FFF3CD;color:#856404;}
.ph-stabilization{background:#D4EDFF;color:#0C5285;}
.ph-maintenance{background:var(--line-soft);color:var(--muted);}

.mp-budget{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0;}
.mp-budget-item{background:var(--card);border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.mp-budget-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px;}
.mp-budget-val{font-family:var(--serif);font-size:18px;font-weight:500;}
.mp-budget-bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;}
.mp-budget-fill{height:100%;border-radius:3px;transition:width .3s;}
.mp-budget-fill.ok{background:var(--green);}
.mp-budget-fill.over{background:var(--red);}
.mp-budget-fill.warn{background:#B08D2E;}

.mp-meals{margin:16px 0;}
.mp-meal-card{background:var(--card);border-radius:10px;padding:12px 16px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;}
.mp-meal-info{flex:1;}
.mp-meal-name{font-weight:500;font-size:14px;}
.mp-meal-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.mp-meal-macros{font-size:12px;color:var(--ink-soft);display:flex;gap:12px;margin-top:4px;}
.mp-meal-slot{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);font-weight:600;}

.mp-add-bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;}

/* Add meal modal */
.mp-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center;}
.mp-modal{background:var(--paper);border-radius:16px;padding:24px;max-width:560px;width:95%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.mp-modal h3{font-family:var(--serif);font-size:18px;margin-bottom:16px;}
.mp-modal label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.mp-modal input,.mp-modal select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;font-size:13px;background:var(--card);}
.mp-modal input:focus,.mp-modal select:focus{border-color:var(--gold);outline:none;}
.mp-search-results{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;}
.mp-search-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;}
.mp-search-item:hover{background:var(--line-soft);}
.mp-search-item:last-child{border-bottom:none;}
.mp-catered-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.mp-catered-col label{font-size:11px;font-weight:600;margin-bottom:6px;}
.mp-catered-opt{padding:6px 10px;cursor:pointer;font-size:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:4px;transition:all .15s;}
.mp-catered-opt:hover{border-color:var(--gold);}
.mp-catered-opt.selected{border-color:var(--gold);background:rgba(176,141,46,.08);font-weight:500;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="brand">AEVUM</div>
  <div class="brand-sub">ADMIN</div>
  <div class="login-box">
    <input type="text" id="tokenInput" placeholder="Admin token" autocomplete="off" spellcheck="false">
    <button class="btn-login" onclick="doLogin()">Sign in</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <nav id="sidebar">
    <div class="sb-brand">
      <div class="mark">AEVUM</div>
      <div class="sub">ADMIN</div>
    </div>
    <div class="sb-section">Reference tables</div>
    <div class="sb-item" data-table="rules" onclick="selectTable('rules')">Rules<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="foods" onclick="selectTable('foods')">Foods<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="policy" onclick="selectTable('policy')">Policy<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="config" onclick="selectTable('config')">Config<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="phases" onclick="selectTable('phases')">Phases<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-section">Content</div>
    <div class="sb-item" data-table="messages" onclick="selectTable('messages')">Messages<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="recipes" onclick="selectTable('recipes')">Recipes<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="movements" onclick="selectTable('movements')">Movements<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="workouts" onclick="selectTable('workouts')">Workouts<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-section">Meal Plan</div>
    <div class="sb-item" data-table="ingredients" onclick="selectTable('ingredients')">Ingredients<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-item" data-table="catered_menu" onclick="selectTable('catered_menu')">Catered Menu<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-section">Onboarding</div>
    <div class="sb-item" data-table="intakes" onclick="selectTable('intakes')">Intakes<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-section">People</div>
    <div class="sb-item" data-table="users" onclick="selectTable('users')">Users<span class="dot"></span><span class="sb-count"></span></div>
    <div class="sb-bottom">
      <span class="sb-logout" onclick="logout()">Sign out</span>
    </div>
  </nav>
  <div id="main">
    <div class="topbar-admin">
      <div style="display:flex;align-items:baseline;">
        <button class="btn-back hidden" id="btnBack" onclick="handleBack()">&#8592; Back</button>
        <h1 id="tableTitle">Rules</h1>
        <span class="meta" id="tableMeta"></span>
      </div>
      <div class="topbar-actions" id="tableActions"></div>
    </div>
    <div id="tableContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://aevum-api-v2.marco-iannitto.workers.dev';
let TOKEN = '';
let activeTable = '';

const store = {};

// ─── API call ────────────────────────────────────────────────
async function api(action, data = {}) {
  const res = await fetch(API, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + TOKEN
    },
    body: JSON.stringify({ action, ...data })
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

// ─── Login ───────────────────────────────────────────────────
async function doLogin() {
  const inp = document.getElementById('tokenInput');
  const err = document.getElementById('loginErr');
  const token = inp.value.trim();
  if (!token) { err.textContent = 'Enter your admin token'; return; }
  TOKEN = token;
  try {
    await api('admin_users');
    sessionStorage.setItem('aevum_admin_token', token);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    selectTable('rules');
  } catch (e) {
    err.textContent = 'Invalid token or not admin';
    TOKEN = '';
  }
}

(function() {
  const saved = sessionStorage.getItem('aevum_admin_token');
  if (saved) {
    TOKEN = saved;
    api('admin_users').then(() => {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      selectTable('rules');
    }).catch(() => { TOKEN = ''; sessionStorage.removeItem('aevum_admin_token'); });
  }
  document.getElementById('tokenInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
})();

// ─── Table selection ─────────────────────────────────────────
async function selectTable(name) {
  activeTable = name;
  activeUserDetail = null;
  activeIntakeDetail = null;
  document.getElementById('btnBack').classList.add('hidden');
  document.querySelectorAll('.sb-item').forEach(el => {
    el.classList.toggle('active', el.dataset.table === name);
  });
  document.getElementById('tableTitle').textContent = name.charAt(0).toUpperCase() + name.slice(1);

  if (!store[name]) {
    document.getElementById('tableContent').innerHTML = '<div class="empty-state"><p>Loading...</p></div>';
    try {
      await loadTable(name);
    } catch (e) {
      document.getElementById('tableContent').innerHTML = '<div class="empty-state"><p>Error: ' + e.message + '</p></div>';
      return;
    }
  }
  renderView(name);
}

async function loadTable(name) {
  let rows;
  if (name === 'users') {
    const res = await api('admin_users');
    rows = res.users || [];
  } else if (name === 'intakes') {
    const res = await api('admin_intakes_list');
    rows = res.intakes || [];
  } else {
    const res = await api('admin_list', { table: name });
    rows = res.rows || [];
  }
  store[name] = { original: structuredClone(rows), current: rows, dirty: false };
  updateCount(name);
}

function updateCount(name) {
  const el = document.querySelector(`.sb-item[data-table="${name}"] .sb-count`);
  if (el && store[name]) el.textContent = store[name].current.length;
}

function markDirty(name) {
  store[name].dirty = true;
  const el = document.querySelector(`.sb-item[data-table="${name}"]`);
  if (el) el.classList.add('dirty');
  renderActions(name);
}

function markClean(name) {
  store[name].dirty = false;
  const el = document.querySelector(`.sb-item[data-table="${name}"]`);
  if (el) el.classList.remove('dirty');
  renderActions(name);
}

// ─── Render ──────────────────────────────────────────────────
function renderView(name) {
  const def = TABLES[name];
  if (def.mode === 'cards') renderPolicyCards(name);
  else if (def.mode === 'users') renderUsersTable(name);
  else if (def.mode === 'intakes') renderIntakesView();
  else renderDataTable(name);
  renderActions(name);
}

function renderActions(name) {
  const acts = document.getElementById('tableActions');
  const def = TABLES[name];
  const d = store[name];
  const meta = document.getElementById('tableMeta');

  if (activeUserDetail) {
    meta.textContent = '';
    acts.innerHTML = '<button class="btn btn-outline" onclick="exportUserCSV()">Export CSV</button>';
    return;
  }

  if (activeIntakeDetail) {
    meta.textContent = '';
    acts.innerHTML = '';
    return;
  }

  meta.textContent = d ? d.current.length + ' rows' : '';

  if (def.mode === 'users') {
    acts.innerHTML = `
      <button class="btn btn-secondary" onclick="refreshTable('${name}')">Refresh</button>
      <button class="btn btn-primary" onclick="showNewUserForm()">+ New User</button>`;
    return;
  }

  if (def.mode === 'intakes') {
    acts.innerHTML = `
      <button class="btn btn-secondary" onclick="refreshTable('intakes')">Refresh</button>
      <button class="btn btn-primary" onclick="showNewIntakeForm()">+ New Intake</button>
    `;
    return;
  }

  const dirty = d && d.dirty;
  acts.innerHTML = `
    <button class="btn btn-secondary" onclick="addRow('${name}')">+ Add row</button>
    <button class="btn btn-secondary" onclick="revertTable('${name}')" ${dirty ? '' : 'disabled'}>Revert</button>
    <button class="btn btn-primary" onclick="saveTable('${name}')" ${dirty ? '' : 'disabled'}>Save changes</button>
  `;
}

function renderDataTable(name) {
  const def = TABLES[name];
  const rows = store[name].current;
  const wrap = document.getElementById('tableContent');
  const stickyFirst = def.stickyCol === true;

  let html = '<div class="table-wrap"><table><thead><tr>';
  def.cols.forEach((col, ci) => {
    const cls = [(col.w || ''), (stickyFirst && ci === 0 ? 'sticky-col' : '')].filter(Boolean).join(' ');
    html += `<th class="${cls}">${col.label}<span class="col-resize"></span></th>`;
  });
  html += '<th></th></tr></thead><tbody>';

  for (let i = 0; i < rows.length; i++) {
    html += '<tr>';
    def.cols.forEach((col, ci) => {
      const val = rows[i][col.key] ?? '';
      const inputType = col.type === 'number' ? 'number' : 'text';
      const cls = [(col.w || ''), (stickyFirst && ci === 0 ? 'sticky-col' : '')].filter(Boolean).join(' ');
      html += `<td class="${cls}"><input type="${inputType}" value="${esc(String(val))}" data-row="${i}" data-col="${col.key}" oninput="cellChange(this,'${name}')"></td>`;
    });
    html += `<td class="row-actions"><button class="btn-del" onclick="delRow('${name}',${i})" title="Delete row">&times;</button></td>`;
    html += '</tr>';
  }

  if (!rows.length) {
    html += `<tr><td colspan="${def.cols.length + 1}" style="text-align:center;padding:30px;color:var(--muted);">No rows. Click "+ Add row" to start.</td></tr>`;
  }

  html += '</tbody></table></div>';
  wrap.innerHTML = html;
  initColResize(wrap);
}

function initColResize(container) {
  const handles = container.querySelectorAll('.col-resize');
  handles.forEach(handle => {
    handle.addEventListener('mousedown', e => {
      e.preventDefault();
      const th = handle.parentElement;
      const startX = e.pageX;
      const startW = th.offsetWidth;
      function onMove(ev) {
        const w = Math.max(50, startW + ev.pageX - startX);
        th.style.width = w + 'px';
        th.style.minWidth = w + 'px';
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function renderPolicyCards(name) {
  const rows = store[name].current;
  const wrap = document.getElementById('tableContent');
  const phases = ['loading', 'activation', 'transition', 'stabilization', 'maintenance', 'tracker', 'recomposition'];

  let html = '<div class="policy-cards">';
  for (const phase of phases) {
    const row = rows.find(r => r.phase === phase);
    const text = row ? row.rules_text : '';
    html += `<div class="policy-card">
      <h3>${phase}</h3>
      <textarea data-phase="${phase}" onchange="policyChange(this,'${name}')" oninput="policyChange(this,'${name}')">${esc(text)}</textarea>
    </div>`;
  }
  html += '</div>';
  wrap.innerHTML = html;
}

function renderUsersTable(name) {
  const rows = store[name].current;
  const wrap = document.getElementById('tableContent');

  let html = '<div class="table-wrap"><table><thead><tr>';
  html += '<th>Name</th><th>Email</th><th>Type</th><th>Start wt</th><th>Logs</th><th>Last Day</th><th>Created</th>';
  html += '</tr></thead><tbody>';

  for (const u of rows) {
    const badge = u.program ? '<span class="user-badge badge-program">Program</span>' : '<span class="user-badge badge-free">Free</span>';
    html += `<tr class="user-row" onclick="openUser('${esc(String(u.id || ''))}')">
      <td style="padding:8px 12px;font-weight:500;">${esc(u.name || '')}</td>
      <td style="padding:8px 12px;font-size:12px;">${esc(u.email || '')}</td>
      <td style="padding:8px 12px;">${badge}</td>
      <td style="padding:8px 12px;text-align:center;">${u.start_weight ? u.start_weight + ' kg' : '-'}</td>
      <td style="padding:8px 12px;text-align:center;">${u.log_count || 0}</td>
      <td style="padding:8px 12px;text-align:center;">${u.last_day || '-'}</td>
      <td style="padding:8px 12px;font-size:12px;color:var(--muted);">${(u.created_at || '').split('T')[0]}</td>
    </tr>`;
  }

  if (!rows.length) {
    html += '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted);">No users yet.</td></tr>';
  }

  html += '</tbody></table></div>';
  wrap.innerHTML = html;
}

async function openUser(userId) {
  document.getElementById('tableContent').innerHTML = '<div class="empty-state"><p>Loading user data...</p></div>';
  document.getElementById('btnBack').classList.remove('hidden');

  try {
    const data = await api('admin_export', { id: userId });
    activeUserDetail = data;
    activeUserDetail._userId = userId;

    const profile = data.profile || {};
    document.getElementById('tableTitle').textContent = profile.name || userId;
    document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));

    renderUserDetail(data);
    renderActions('users');
  } catch (e) {
    document.getElementById('tableContent').innerHTML = '<div class="empty-state"><p>Error: ' + e.message + '</p></div>';
  }
}

function handleBack() {
  if (activeIntakeDetail || activeTable === 'intakes') { backToIntakes(); return; }
  backToUsers();
}

function backToUsers() {
  destroyCharts();
  activeUserDetail = null;
  selectTable('users');
}

function destroyCharts() {
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch {} });
  chartInstances = {};
}

function statCard(label, value, sub) {
  return `<div class="ud-stat"><div class="label">${label}</div><div class="value">${value}</div>${sub ? '<div class="sub">' + sub + '</div>' : ''}</div>`;

// ─── Charts ───
function renderWeightChart(parsed) {
  const pts = parsed.filter(l => l.weight > 0);
  if (!pts.length) return;

  const ctx = document.getElementById('chartWeight');
  if (!ctx) return;

  chartInstances.weight = new Chart(ctx, {
    type: 'line',
    data: {
      labels: pts.map(p => 'D' + p.day),
      datasets: [{
        label: 'Weight (kg)',
        data: pts.map(p => p.weight),
        borderColor: '#B08D2E',
        backgroundColor: 'rgba(176,141,46,0.08)',
        fill: true,
        tension: 0.3,
        pointRadius: pts.length > 20 ? 1 : 3,
        pointHoverRadius: 5,
        borderWidth: 2
      }]
    },
    options: chartOpts('kg')
  });
}

function renderKcalChart(parsed) {
  const pts = parsed.filter(l => l.kcal > 0);
  if (!pts.length) return;

  const ctx = document.getElementById('chartKcal');
  if (!ctx) return;

  const target = activeUserDetail.profile ? activeUserDetail.profile.current_target_kcal : null;

  const datasets = [{
    label: 'Calories',
    data: pts.map(p => p.kcal),
    borderColor: '#4a6fa5',
    backgroundColor: 'rgba(74,111,165,0.08)',
    fill: true,
    tension: 0.3,
    pointRadius: pts.length > 20 ? 1 : 3,
    pointHoverRadius: 5,
    borderWidth: 2
  }];

  if (target) {
    datasets.push({
      label: 'Target',
      data: pts.map(() => target),
      borderColor: 'rgba(161,48,36,0.4)',
      borderDash: [6, 4],
      pointRadius: 0,
      borderWidth: 1.5,
      fill: false
    });
  }

  chartInstances.kcal = new Chart(ctx, {
    type: 'line',
    data: {
      labels: pts.map(p => 'D' + p.day),
      datasets
    },
    options: chartOpts('kcal')
  });
}

function chartOpts(unit) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1A1A1A',
        titleFont: { size: 12 },
        bodyFont: { size: 12 },
        padding: 10,
        cornerRadius: 8,
        callbacks: {
          label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y + (unit === 'kg' ? ' kg' : ' kcal')
        }
      }
    },
    scales: {
      x: {
        ticks: { font: { size: 10 }, color: '#938c7d', maxTicksLimit: 15 },
        grid: { display: false }
      },
      y: {
        ticks: { font: { size: 10 }, color: '#938c7d' },
        grid: { color: 'rgba(235,229,216,0.5)' }
      }
    }
  };
}

// ─── Log tabs ───
function switchLogTab(el, tab) {
  el.parentElement.querySelectorAll('.ud-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const logs = activeUserDetail.logs || [];
  const parsed = logs.map(l => {
    let dj = {};
    if (l.day_json) {
      try { dj = typeof l.day_json === 'string' ? JSON.parse(l.day_json) : l.day_json; } catch {}
    }
    return { ...l, _dj: dj };
  });
  renderLogTab(tab, parsed);
}

function renderLogTab(tab, parsed) {
  const el = document.getElementById('logTabContent');
  if (tab === 'logs') el.innerHTML = renderLogsTable(parsed);
  else if (tab === 'meals') el.innerHTML = renderMealsTable(parsed);
  else if (tab === 'mealplan') { el.innerHTML = ''; initMealPlanBuilder(el); return; }
  else if (tab === 'notes') el.innerHTML = renderNotesTable(parsed);
  else if (tab === 'vitals') el.innerHTML = renderVitalsTable(parsed);
  else if (tab === 'scans') { renderScansTab(el); return; }
}

// ─── CSV Export ───
function exportUserCSV() {
  if (!activeUserDetail) return;
  const logs = activeUserDetail.logs || [];
  const profile = activeUserDetail.profile || {};

  const headers = ['day','date','phase','weight','waist','serum_am','serum_pm','kcal','protein','fat','carbs','water_ml','exercise','exercise_kcal','energy','hunger','sleep','notes','meals'];
  let csv = headers.join(',') + '\n';

  for (const l of logs) {
    let dj = {};
    if (l.day_json) { try { dj = JSON.parse(l.day_json); } catch {} }
    const meals = (dj.meals || dj.m || []).map(m => (m.name || m.n || '') + ':' + (m.kcal || m.k || '')).join('; ');

    const row = [
      l.day, csvVal(l.date), csvVal(l.phase), l.weight || '', l.waist || '',
      csvVal(l.serum_am), csvVal(l.serum_pm),
      l.kcal || '', l.protein || '', l.fat || '', l.carbs || '', l.water_ml || '',
      csvVal(l.exercise), l.exercise_kcal || '',
      csvVal(l.energy), csvVal(l.hunger), csvVal(l.sleep),
      csvVal(l.notes), csvVal(meals)
    ];
    csv += row.join(',') + '\n';
  }

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (profile.name || 'user').replace(/\s+/g, '_') + '_export.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

function csvVal(v) {
  if (v === null || v === undefined || v === '') return '';
  const s = String(v);
  if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

async function createUser() {
  const name = document.getElementById('nuName').value.trim();
  const email = document.getElementById('nuEmail').value.trim();
  const dob = document.getElementById('nuDob').value;
  const height = document.getElementById('nuHeight').value;
  const weight = document.getElementById('nuWeight').value;

  if (!name) { toast('Name is required', true); return; }
  if (!email) { toast('Email is required', true); return; }
  if (!dob) { toast('Date of birth is required', true); return; }
  if (!height) { toast('Height is required', true); return; }
  if (!weight) { toast('Weight is required', true); return; }

  try {
    const res = await api('admin_user_create', {
      name,
      email,
      sex: document.getElementById('nuSex').value,
      dob,
      height: parseFloat(height),
      weight: parseFloat(weight),
      target_kg: parseFloat(document.getElementById('nuTargetKg').value) || null
    });
    toast('User created: ' + res.user_id);
    delete store.users;
    openUser(res.user_id);
  } catch (e) { toast('Error: ' + e.message, true); }
}

async function deleteUser(userId) {

async function saveUserFields() {
  if (!activeUserDetail) return;
  const updates = {};
  const name = document.getElementById('udName').value.trim();
  const email = document.getElementById('udEmail').value.trim();
  const startDate = document.getElementById('udStartDate').value;
  const loadDays = document.getElementById('udLoadDays').value;
  const actDays = document.getElementById('udActDays').value;
  const transDays = document.getElementById('udTransDays').value;
  const stabDays = document.getElementById('udStabDays').value;
  const targetKcal = document.getElementById('udTargetKcal').value;
  const targetKg = document.getElementById('udTargetKg').value;
  const sex = document.getElementById('udSex').value;
  const dob = document.getElementById('udDob').value;
  const height = document.getElementById('udHeight').value;
  if (name) updates.name = name;
  if (email) updates.email = email;
  if (startDate) updates.start_date = startDate;
  if (loadDays !== '') updates.loading_days = parseInt(loadDays);
  if (actDays !== '') updates.activation_days = parseInt(actDays);
  if (transDays !== '') updates.transition_days = parseInt(transDays);
  if (stabDays !== '') updates.stabilization_days = parseInt(stabDays);
  if (targetKcal !== '') updates.current_target_kcal = parseInt(targetKcal);
  if (targetKg !== '') updates.target_kg = parseFloat(targetKg);
  updates.sex = sex;
  if (dob) updates.dob = dob;
  if (height !== '') updates.height = parseInt(height);
  if (!Object.keys(updates).length) { toast('Nothing to save'); return; }
  try {
    updates.id = activeUserDetail._userId;
    await api('admin_update_user', updates);
    toast('Saved');
    delete store.users;
    await openUser(activeUserDetail._userId);
  } catch (e) {
    toast('Error: ' + e.message, true);
  }
}

// ─── Cell editing ────────────────────────────────────────────
function cellChange(input, name) {
  const row = parseInt(input.dataset.row);
  const col = input.dataset.col;
  let val = input.value;
  const def = TABLES[name].cols.find(c => c.key === col);
  if (def && def.type === 'number') {
    val = val === '' ? null : parseFloat(val);
    if (isNaN(val)) val = null;
  }
  store[name].current[row][col] = val;
  markDirty(name);
}

function policyChange(textarea, name) {
  const phase = textarea.dataset.phase;
  const rows = store[name].current;
  let row = rows.find(r => r.phase === phase);
  if (!row) {
    row = { phase, rules_text: '' };
    rows.push(row);
  }
  row.rules_text = textarea.value;
  markDirty(name);
}

// ─── Row operations ──────────────────────────────────────────
function addRow(name) {
  const def = TABLES[name];
  if (def.mode === 'cards') { toast('All phases already shown'); return; }
  const row = {};
  for (const col of def.cols) {
    row[col.key] = col.type === 'number' ? null : '';
  }
  store[name].current.push(row);
  markDirty(name);
  renderView(name);
  const main = document.getElementById('main');
  setTimeout(() => main.scrollTop = main.scrollHeight, 50);
}

function delRow(name, idx) {
  store[name].current.splice(idx, 1);
  markDirty(name);
  renderView(name);
}

// ─── Save / Revert ───────────────────────────────────────────
async function saveTable(name) {
  const rows = store[name].current;
  const hasAutoPK = !['config'].includes(name);
  const cleanRows = rows.map(r => {
    const copy = { ...r };
    for (const k of Object.keys(copy)) {
      if (copy[k] === null || copy[k] === undefined) delete copy[k];
    }
    if (hasAutoPK && typeof copy.id === 'number') delete copy.id;
    return copy;
  }).filter(r => Object.keys(r).length > 0);

  try {
    await api('admin_seed', { table: name, rows: cleanRows });
    await loadTable(name);
    markClean(name);
    renderView(name);
    toast('Saved ' + cleanRows.length + ' rows to ' + name);
  } catch (e) {
    toast('Error: ' + e.message, true);
  }
}

async function revertTable(name) {
  store[name].current = structuredClone(store[name].original);
  markClean(name);
  renderView(name);
  toast('Reverted ' + name);
}

async function refreshTable(name) {

async function createIntake() {
  const prefill = {
    full_name: document.getElementById('ifName').value.trim(),
    email: document.getElementById('ifEmail').value.trim(),
    phone: document.getElementById('ifPhone').value.trim(),
    dob: document.getElementById('ifDob').value,

    height: parseFloat(document.getElementById('ifHeight').value) || null,
    address: document.getElementById('ifAddress').value.trim(),
    postal_code: document.getElementById('ifPostal').value.trim(),
    referral: document.getElementById('ifReferral').value,
    goals: document.getElementById('ifGoals').value.trim()
  };

  // Validate required fields
  if (!prefill.full_name) { toast('Name is required', true); return; }
  if (!prefill.email) { toast('Email is required', true); return; }
  if (!prefill.phone) { toast('Phone is required', true); return; }
  if (!prefill.dob) { toast('Date of birth is required', true); return; }
  if (!prefill.weight) { toast('Weight is required', true); return; }
  if (!prefill.height) { toast('Height is required', true); return; }
  if (!prefill.address || prefill.address.length < 10) { toast('Full address required (min 10 chars)', true); return; }
  if (!prefill.postal_code) { toast('Postal code required', true); return; }

function renderIntakeDetail(data) {
  const wrap = document.getElementById('tableContent');
  const p = data.prefill || {};
  const r = data.response || {};
  const isDraft = data.status === 'draft';

  let html = '<div class="intake-detail">';

  // Status bar
  html += `<div class="intake-status-bar">
    ${intakeBadge(data.status)}
    <span style="font-size:12px;color:var(--muted);">Token: ${data.token}</span>
    <span style="font-size:12px;color:var(--muted);">Created: ${(data.created_at||'').replace('T',' ').slice(0,16)}</span>
    ${data.submitted_at ? '<span style="font-size:12px;color:var(--green);">Submitted: '+data.submitted_at.replace('T',' ').slice(0,16)+'</span>' : ''}
    ${data.expires_at ? '<span style="font-size:12px;color:var(--muted);">Expires: '+data.expires_at.split('T')[0]+'</span>' : ''}
  </div>`;

  // Action buttons
  const intakeUrl = 'https://app.niramaya.sg/intake.html?t=' + data.token;
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
  html += `<button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${intakeUrl}');toast('URL copied')">📋 Copy Onboarding URL</button>`;
  if (data.status === 'submitted' || data.status === 'review_required') {
    html += `<button class="btn btn-primary" onclick="setIntakeStatus('${data.token}','approved')">✓ Approve</button>`;
  }
  if (data.status === 'review_required') {
    html += `<button class="btn btn-outline" style="border-color:var(--red);color:var(--red);" onclick="setIntakeStatus('${data.token}','draft')">↩ Back to Draft</button>`;
  }
  if (isDraft) {
    html += `<button class="btn btn-secondary" onclick="editIntakePrefill('${data.token}')">Edit Part A</button>`;
    html += `<button class="btn btn-primary" onclick="markSentAndCopyLink('${data.token}')">Mark Sent & Copy Link</button>`;
  }
  html += `<button class="btn btn-outline" onclick="resendIntake('${data.token}')">Re-send Link</button>`;
  html += `<button class="btn btn-outline" onclick="duplicateIntake('${data.token}')">Duplicate</button>`;
  html += `<button class="btn btn-outline" style="border-color:var(--red);color:var(--red);" onclick="deleteIntake('${data.token}')">🗑 Delete</button>`;
  html += '</div>';

  // Linked user
  if (data.user_id) {
    html += `<div style="margin-top:8px;font-size:12px;color:var(--muted);">Linked user ID: <span style="color:var(--text);font-weight:500;">${data.user_id}</span></div>`;
  }

  // Part A
  html += '<div class="intake-section"><h3>Part A — Meeting Notes' + (isDraft ? ' <span style="font-size:11px;color:var(--muted);font-weight:400;">(editable)</span>' : ' <span style="font-size:11px;color:var(--muted);font-weight:400;">(locked)</span>') + '</h3>';
  const fields_a = [
    ['Full name', p.full_name], ['Email', p.email], ['Phone', p.phone],
    ['Date of birth', p.dob], ['Weight', p.weight ? p.weight+' kg' : ''], ['Height', p.height ? p.height+' cm' : ''],
    ['Address', p.address], ['Postal code', p.postal_code],
    ['Referral', p.referral], ['Goals', p.goals]
  ];
  for (const [label, val] of fields_a) {
    html += `<div class="intake-field"><div class="if-label">${label}</div><div class="if-value">${esc(String(val||'-'))}</div></div>`;
  }
  html += '</div>';

  // Part B (if any)
  if (r && Object.keys(r).length > 0) {
    html += '<div class="intake-section"><h3>Part B — Client Responses</h3>';

    // Screen 1: Food & Schedule
    if (r.food_preferences || r.dislikes || r.delivery_times) {
      html += '<div style="margin-bottom:8px;font-size:12px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;">Food & Schedule</div>';
      if (r.food_preferences) html += `<div class="intake-field"><div class="if-label">Preferences</div><div class="if-value">${esc(Array.isArray(r.food_preferences) ? r.food_preferences.join(', ') : String(r.food_preferences))}</div></div>`;
      if (r.dislikes) html += `<div class="intake-field"><div class="if-label">Dislikes</div><div class="if-value">${esc(r.dislikes)}</div></div>`;
      if (r.delivery_times) html += `<div class="intake-field"><div class="if-label">Delivery times</div><div class="if-value">${esc(Array.isArray(r.delivery_times) ? r.delivery_times.join(', ') : String(r.delivery_times))}</div></div>`;
    }

    // Screen 2: Lifestyle
    if (r.exercise || r.travel_planned !== undefined) {
      html += '<div style="margin-top:12px;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;">Lifestyle</div>';
      if (r.exercise) html += `<div class="intake-field"><div class="if-label">Exercise</div><div class="if-value">${esc(r.exercise)}</div></div>`;
      if (r.travel_planned !== undefined) {
        const travelDetail = r.travel_planned ? 'Yes' + (r.travel_from ? ' — '+esc(r.travel_from)+(r.travel_to ? ' to '+esc(r.travel_to) : '') : '') : 'No';
        html += `<div class="intake-field"><div class="if-label">Travel planned</div><div class="if-value">${travelDetail}</div></div>`;
      }
    }

    // Screen 3: Health
    if (r.has_allergies !== undefined || r.has_medications !== undefined || r.has_medical_conditions !== undefined || r.pregnant !== undefined) {
      html += '<div style="margin-top:12px;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;">Health Check</div>';
      if (r.has_allergies !== undefined) html += `<div class="intake-field"><div class="if-label">Allergies</div><div class="if-value">${r.has_allergies ? esc(r.allergies || 'Yes') : 'None'}</div></div>`;
      if (r.has_medications !== undefined) html += `<div class="intake-field"><div class="if-label">Medications</div><div class="if-value">${r.has_medications ? esc(r.medications || 'Yes') : 'None'}</div></div>`;
      if (r.has_medical_conditions !== undefined) html += `<div class="intake-field"><div class="if-label">Medical conditions</div><div class="if-value">${r.has_medical_conditions ? esc(r.medical_conditions || 'Yes') : 'None'}</div></div>`;
      if (r.pregnant !== undefined) html += `<div class="intake-field"><div class="if-label">Pregnant / breastfeeding</div><div class="if-value">${r.pregnant ? '<span style="color:var(--red);font-weight:600;">Yes ⚠</span>' : 'No'}</div></div>`;
    }

    // Screen 4: InBody
    if (r.scan_dates && r.scan_dates.length > 0) {
      html += '<div style="margin-top:12px;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;">Getting Started</div>';
      html += `<div class="intake-field"><div class="if-label">InBody scan dates</div><div class="if-value">${esc(r.scan_dates.join(', '))}${r.scan_time ? ' — '+esc(r.scan_time) : ''}</div></div>`;
    }

    // Screen 5: Consent
    if (r.consent) {
      html += '<div style="margin-top:12px;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;">Consent</div>';
      html += `<div class="intake-field"><div class="if-label">Confirmed</div><div class="if-value" style="color:var(--green);">✓ Yes</div></div>`;
      if (r.testimonial !== undefined) html += `<div class="intake-field"><div class="if-label">Testimonial OK</div><div class="if-value">${r.testimonial ? 'Yes' : 'No'}</div></div>`;
      if (r.age_confirm) html += `<div class="intake-field"><div class="if-label">Age confirmed 18+</div><div class="if-value">✓</div></div>`;
    }

    html += '</div>';
  } else if (data.status !== 'draft') {
    html += '<div class="intake-section"><h3>Part B — Client Responses</h3><p style="color:var(--muted);font-size:13px;">Not yet started.</p></div>';
  }

  html += '</div>';
  wrap.innerHTML = html;
}

// ─── Helpers ─────────────────────────────────────────────────
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2500);
}

// ─── Keyboard shortcut ──────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (activeTable && store[activeTable] && store[activeTable].dirty) {
      saveTable(activeTable);
    }
  }
});

// MEAL PLAN BUILDER
// ═══════════════════════════════════════════════════════════════

const PH_FIXED = { loading: 2, transition: 3, stabilization: 18 };
let mpState = { day: 1, meals: [], rules: [], recipes: [], ingredients: [], catered: [], plan: {} };

async function initMealPlanBuilder(container) {
  const profile = activeUserDetail.profile || {};
  if (!profile.start_date) {
    container.innerHTML = '<div style="padding:30px;text-align:center;color:var(--muted);">User has no start_date set. Set it to enable meal planning.</div>';
    return;
  }

  container.innerHTML = '<div style="padding:20px;color:var(--muted);">Loading meal plan data...</div>';

  // Load rules, recipes, ingredients, catered menu, and existing plan in parallel
  try {
    const [rulesRes, recipesRes, ingredientsRes, cateredRes, planRes] = await Promise.all([
      api('admin_list', { table: 'rules' }),
      api('admin_list', { table: 'recipes' }),
      api('admin_mealplan', { user_id: activeUserDetail._userId, sub: 'ingredients' }),
      api('admin_mealplan', { user_id: activeUserDetail._userId, sub: 'catered' }),
      api('admin_mealplan', { user_id: activeUserDetail._userId, sub: 'plan' })
    ]);
    mpState.rules = rulesRes.rows || [];
    mpState.recipes = recipesRes.rows || [];
    mpState.ingredients = ingredientsRes.ingredients || [];
    mpState.catered = cateredRes.catered_menu || [];

    // Index plan by day
    mpState.plan = {};
    for (const row of (planRes.plan || [])) {
      if (!mpState.plan[row.day]) mpState.plan[row.day] = [];
      mpState.plan[row.day].push(row);
    }

    mpState.day = 1;
    renderMealPlanBuilder(container);
  } catch (e) {
    container.innerHTML = '<div style="padding:20px;color:var(--red);">Error loading: ' + e.message + '</div>';
  }
}

function getPhaseForDay(day, profile) {
  const ld = +profile.loading_days || PH_FIXED.loading;
  const ad = +profile.activation_days || 8;
  const td = +profile.transition_days || PH_FIXED.transition;
  const sd = +profile.stabilization_days || PH_FIXED.stabilization;
  if (day <= ld) return 'loading';
  if (day <= ld + ad) return 'activation';
  if (day <= ld + ad + td) return 'transition';
  if (day <= ld + ad + td + sd) return 'stabilization';
  return 'maintenance';
}

function getPhaseTargets(phase, profile) {
  const model = profile.activation_model || 'macros';
  const targetKg = profile.target_kg || 70;
  const targets = { kcal: 0, protein: 0, fat: 0, carbs: 0 };

  for (const r of mpState.rules) {
    if (r.phase !== phase) continue;
    if (r.model !== 'all' && r.model !== model) continue;
    const metric = r.metric;
    if (!['kcal', 'protein', 'fat', 'carbs'].includes(metric)) continue;

    let val = r.value || 0;
    if (r.basis === 'per_kg_target_weight') val = val * targetKg;
    // For adaptive_kcal and pct_of_kcal, we need kcal first
    targets[metric] = Math.round(val);
  }

  // Second pass for pct_of_kcal
  for (const r of mpState.rules) {
    if (r.phase !== phase) continue;
    if (r.model !== 'all' && r.model !== model) continue;
    if (r.basis === 'pct_of_kcal' && targets.kcal > 0) {
      const metric = r.metric;
      if (['fat', 'carbs'].includes(metric)) {
        const divisor = metric === 'fat' ? 9 : 4;
        targets[metric] = Math.round(targets.kcal * (r.value / 100) / divisor);
      }
    }
  }

  // Override kcal from profile if set
  if (profile.current_target_kcal) targets.kcal = profile.current_target_kcal;

  return targets;
}

function dayToDate(day, startDate) {
  const d = new Date(startDate);
  d.setDate(d.getDate() + day - 1);
  return d;
}

function dateToProgramDay(date, startDate) {
  const start = new Date(startDate);
  start.setHours(0,0,0,0);
  const d = new Date(date);
  d.setHours(0,0,0,0);
  return Math.floor((d - start) / 86400000) + 1;
}

// Calendar month navigation state
let mpCalMonth = null; // {year, month} - set on first render

function renderMealPlanBuilder(container) {
  const profile = activeUserDetail.profile || {};
  const ld = +profile.loading_days || PH_FIXED.loading;
  const actDays = +profile.activation_days || 8;
  const td = +profile.transition_days || PH_FIXED.transition;
  const sd = +profile.stabilization_days || PH_FIXED.stabilization;
  const totalDays = ld + actDays + td + sd + 14; // +14 for maintenance
  const phase = getPhaseForDay(mpState.day, profile);
  const targets = getPhaseTargets(phase, profile);
  const dayMeals = mpState.plan[mpState.day] || [];

  // Sum current day macros
  const totals = { kcal: 0, protein: 0, fat: 0, carbs: 0 };
  for (const m of dayMeals) {
    totals.kcal += m.kcal || 0;
    totals.protein += m.protein || 0;
    totals.fat += m.fat || 0;
    totals.carbs += m.carbs || 0;
  }

  let html = '<div class="mp-wrap">';

  // Calendar grid
  const startDate = profile.start_date;
  const selectedDate = dayToDate(mpState.day, startDate);
  const today = new Date(); today.setHours(0,0,0,0);

  // Init calendar month to today's month
  if (!mpCalMonth) {
    mpCalMonth = { year: today.getFullYear(), month: today.getMonth() };
  }

  const calYear = mpCalMonth.year;
  const calMon = mpCalMonth.month;
  const firstOfMonth = new Date(calYear, calMon, 1);
  const startDow = firstOfMonth.getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMon + 1, 0).getDate();
  const monthLabel = firstOfMonth.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

  const phaseColors = { loading: '#E8D5E0', activation: '#E8F2EF', transition: '#FFF3CD', stabilization: '#D4EDFF', maintenance: 'var(--line-soft)' };

  html += '<div class="mp-calendar">';
  html += `<div class="mp-cal-nav">
    <button onclick="mpCalMonth.month--;if(mpCalMonth.month<0){mpCalMonth.month=11;mpCalMonth.year--;}renderMealPlanBuilder(this.closest('.mp-wrap').parentElement);">&larr;</button>
    <span>${monthLabel}</span>
    <button onclick="mpCalMonth.month++;if(mpCalMonth.month>11){mpCalMonth.month=0;mpCalMonth.year++;}renderMealPlanBuilder(this.closest('.mp-wrap').parentElement);">&rarr;</button>
  </div>`;
  html += '<div class="mp-cal-grid">';
  // Day headers
  for (const dh of ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']) {
    html += `<div class="mp-cal-hdr">${dh}</div>`;
  }
  // Empty cells before first day
  for (let i = 0; i < startDow; i++) {
    html += '<div class="mp-day outside"></div>';
  }
  // Days of month
  for (let d = 1; d <= daysInMonth; d++) {
    const cellDate = new Date(calYear, calMon, d);
    const progDay = dateToProgramDay(cellDate, startDate);
    const inProgram = progDay >= 1 && progDay <= totalDays;
    const isActive = progDay === mpState.day && inProgram;
    const isToday = cellDate.getTime() === today.getTime();
    const hasMeals = inProgram && mpState.plan[progDay] && mpState.plan[progDay].length > 0;
    const ph = inProgram ? getPhaseForDay(progDay, profile) : null;
    const bgColor = ph ? phaseColors[ph] : '';

    let cls = 'mp-day';
    if (isActive) cls += ' active';
    if (isToday) cls += ' today';
    if (hasMeals) cls += ' has-meals';
    if (!inProgram) cls += ' outside';

    const onclick = inProgram ? `onclick="mpSelectDay(${progDay})"` : '';
    const progLabel = inProgram ? `<div class="mp-d-prog">D${progDay}</div>` : '';

    html += `<div class="${cls}" ${onclick} style="background:${isActive ? 'var(--card)' : bgColor};">
      <div class="mp-d-num">${d}</div>${progLabel}
    </div>`;
  }
  html += '</div>';
  // Legend
  html += '<div class="mp-cal-legend">';
  for (const [k, c] of Object.entries(phaseColors)) {
    html += `<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};vertical-align:middle;margin-right:3px;"></span>${k}</span>`;
  }
  html += ' <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--gold);vertical-align:middle;margin-right:3px;"></span>today</span>';
  html += '</div>';
  html += '</div>';

  // Phase + target info
  html += `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
    <span class="mp-phase-label ph-${phase}" style="font-size:11px;padding:4px 10px;">${phase}</span>
    <span style="font-size:13px;font-weight:500;">Day ${mpState.day}</span>
    <span style="font-size:12px;color:var(--muted);">${dayToDate(mpState.day, profile.start_date).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}</span>
  </div>`;

  // Budget bars
  html += '<div class="mp-budget">';
  for (const key of ['kcal', 'protein', 'fat', 'carbs']) {
    const target = targets[key] || 0;
    const current = totals[key];
    const pct = target > 0 ? Math.min((current / target) * 100, 120) : 0;
    const cls = pct > 105 ? 'over' : pct > 85 ? 'ok' : 'warn';
    const unit = key === 'kcal' ? '' : 'g';
    html += `<div class="mp-budget-item">
      <div class="mp-budget-label">${key}</div>
      <div class="mp-budget-val">${current}${unit} <span style="font-size:12px;color:var(--muted);font-family:var(--sans);">/ ${target}${unit}</span></div>
      <div class="mp-budget-bar"><div class="mp-budget-fill ${cls}" style="width:${Math.min(pct, 100)}%"></div></div>
    </div>`;
  }
  html += '</div>';

  // Meals list
  html += '<div class="mp-meals">';
  if (!dayMeals.length) {
    html += '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">No meals planned for this day.</div>';
  }
  for (let i = 0; i < dayMeals.length; i++) {
    const m = dayMeals[i];
    const typeLabel = m.meal_type === 'catered' ? 'Catered' : m.meal_type === 'modular' ? 'Modular' : 'Recipe';
    html += `<div class="mp-meal-card">
      <div class="mp-meal-info">
        ${m.meal_slot ? '<div class="mp-meal-slot">' + esc(m.meal_slot) + '</div>' : ''}
        <div class="mp-meal-name">${esc(m.meal || m.recipe || 'Unnamed')}</div>
        <div class="mp-meal-meta">${typeLabel}</div>
        <div class="mp-meal-macros">
          <span>${m.kcal} kcal</span>
          <span>P: ${m.protein}g</span>
          <span>F: ${m.fat}g</span>
          <span>C: ${m.carbs}g</span>
        </div>
      </div>
      <button class="btn-del" onclick="mpRemoveMeal(${i})" title="Remove">&times;</button>
    </div>`;
  }
  html += '</div>';

  // Action bar
  html += `<div class="mp-add-bar">
    <button class="btn btn-primary" onclick="mpOpenAddModal('recipe')">+ Recipe</button>
    <button class="btn btn-primary" onclick="mpOpenAddModal('modular')">+ Modular</button>
    <button class="btn btn-primary" onclick="mpOpenAddModal('catered')">+ Catered</button>
    <div style="flex:1;"></div>
    <button class="btn btn-outline" onclick="mpCopyDay()">Copy day to...</button>
    <button class="btn btn-danger" onclick="mpClearDay()">Clear day</button>
  </div>`;

  html += '</div>';
  container.innerHTML = html;
}

function mpSelectDay(day) {
  mpState.day = day;
  const container = document.getElementById('logTabContent');
  renderMealPlanBuilder(container);
}

async function mpRemoveMeal(idx) {
  const dayMeals = mpState.plan[mpState.day] || [];
  dayMeals.splice(idx, 1);
  if (!dayMeals.length) delete mpState.plan[mpState.day];
  await mpSaveDay();
  const container = document.getElementById('logTabContent');
  renderMealPlanBuilder(container);
}

async function mpClearDay() {
  if (!confirm('Clear all meals for day ' + mpState.day + '?')) return;
  try {
    await api('admin_mealplan', { user_id: activeUserDetail._userId, sub: 'delete', day: mpState.day });
    delete mpState.plan[mpState.day];
    toast('Day ' + mpState.day + ' cleared');
    const container = document.getElementById('logTabContent');
    renderMealPlanBuilder(container);
  } catch (e) {
    toast('Error: ' + e.message, true);
  }
}

async function mpCopyDay() {
  const toDay = prompt('Copy day ' + mpState.day + ' meals to which day?');
  if (!toDay || isNaN(+toDay)) return;
  try {
    await api('admin_mealplan', { user_id: activeUserDetail._userId, sub: 'copy', from_day: mpState.day, to_day: +toDay });
    // Reload the plan for the target day
    const src = mpState.plan[mpState.day] || [];
    mpState.plan[+toDay] = src.map(m => ({ ...m, day: +toDay }));
    toast('Copied day ' + mpState.day + ' to day ' + toDay);
    const container = document.getElementById('logTabContent');
    renderMealPlanBuilder(container);
  } catch (e) {
    toast('Error: ' + e.message, true);
  }
}

async function mpSaveDay() {
  const dayMeals = mpState.plan[mpState.day] || [];
  if (!dayMeals.length) {
    try { await api('admin_mealplan', { user_id: activeUserDetail._userId, sub: 'delete', day: mpState.day }); } catch {}
    return;
  }
  const rows = dayMeals.map(m => ({
    day: mpState.day,
    meal: m.meal || '',
    recipe: m.recipe || '',
    kcal: m.kcal || 0,
    protein: m.protein || 0,
    fat: m.fat || 0,
    carbs: m.carbs || 0,
    meal_type: m.meal_type || 'recipe',
    meal_slot: m.meal_slot || '',
    components_json: m.components_json || ''
  }));
  try {
    await api('admin_mealplan', { user_id: activeUserDetail._userId, sub: 'save', rows });
  } catch (e) {
    toast('Save error: ' + e.message, true);
  }
}

function mpOpenAddModal(type) {
  const slotOptions = ['breakfast', 'lunch', 'dinner', 'snack'].map(s =>
    `<option value="${s}">${s.charAt(0).toUpperCase() + s.slice(1)}</option>`
  ).join('');

  let html = `<div class="mp-modal-bg" onclick="if(event.target===this)this.remove()">
    <div class="mp-modal">
      <h3>Add ${type === 'recipe' ? 'Recipe' : type === 'modular' ? 'Modular Meal' : 'Catered Meal'}</h3>
      <label>Meal slot</label>
      <select id="mpSlot">${slotOptions}</select>`;

  if (type === 'recipe') {
    html += `<label>Search recipes</label>
      <input type="text" id="mpRecipeSearch" placeholder="Type to search..." oninput="mpFilterRecipes(this.value)">
      <div class="mp-search-results" id="mpRecipeResults"></div>`;
  } else if (type === 'modular') {
    html += `<label>Search ingredients</label>
      <input type="text" id="mpIngSearch" placeholder="Type to search..." oninput="mpFilterIngredients(this.value)">
      <div class="mp-search-results" id="mpIngResults"></div>
      <div id="mpModularSelected" style="margin-bottom:10px;"></div>
      <div id="mpModularTotals" style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;"></div>
      <button class="btn btn-primary" onclick="mpAddModularMeal()">Add meal</button>`;
  } else {
    // Catered
    html += '<div class="mp-catered-grid">';
    const cats = ['protein', 'vegetable', 'structure', 'flavoring'];
    for (const cat of cats) {
      const items = mpState.catered.filter(c => c.category === cat);
      html += `<div class="mp-catered-col"><label>${cat.charAt(0).toUpperCase() + cat.slice(1)}</label>`;
      for (const item of items) {
        html += `<div class="mp-catered-opt" data-cat="${cat}" data-id="${item.id}" onclick="mpToggleCatered(this,'${cat}',${item.id})">${esc(item.name)}</div>`;
      }
      html += '</div>';
    }
    html += '</div>';
    html += `<label>Meal name (auto-generated)</label>
      <input type="text" id="mpCateredName" placeholder="Will be generated from selections" readonly>
      <div id="mpCateredTotals" style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;"></div>
      <button class="btn btn-primary" onclick="mpAddCateredMeal()">Add meal</button>`;
  }

  html += `<div style="margin-top:12px;text-align:right;"><button class="btn btn-outline" onclick="this.closest('.mp-modal-bg').remove()">Cancel</button></div>
    </div></div>`;

  document.body.insertAdjacentHTML('beforeend', html);

  if (type === 'recipe') mpFilterRecipes('');
}

// Recipe search
function mpFilterRecipes(query) {
  const q = query.toLowerCase();
  const results = mpState.recipes.filter(r =>
    !q || (r.name || '').toLowerCase().includes(q) || (r.cuisine || '').toLowerCase().includes(q) || (r.protein || '').toLowerCase().includes(q)
  ).slice(0, 20);

  const el = document.getElementById('mpRecipeResults');
  if (!results.length) { el.innerHTML = '<div style="padding:12px;color:var(--muted);text-align:center;">No recipes found</div>'; return; }

  el.innerHTML = results.map(r =>
    `<div class="mp-search-item" onclick="mpAddRecipeMeal('${esc(r.name)}',${r.kcal||0},${r.protein_g||0},${r.fat_g||0},${r.carbs_g||0})">
      <span>${esc(r.name)}</span>
      <span style="color:var(--muted);font-size:11px;">${r.kcal||0} kcal | P${r.protein_g||0} F${r.fat_g||0} C${r.carbs_g||0}</span>
    </div>`
  ).join('');
}

async function mpAddRecipeMeal(name, kcal, p, f, c) {
  const slot = document.getElementById('mpSlot').value;
  const meal = { day: mpState.day, meal: name, recipe: name, kcal, protein: p, fat: f, carbs: c, meal_type: 'recipe', meal_slot: slot, components_json: '' };
  if (!mpState.plan[mpState.day]) mpState.plan[mpState.day] = [];
  mpState.plan[mpState.day].push(meal);
  await mpSaveDay();
  document.querySelector('.mp-modal-bg').remove();
  toast('Added: ' + name);
  const container = document.getElementById('logTabContent');
  renderMealPlanBuilder(container);
}

// Modular meal
let mpModularItems = [];

function mpFilterIngredients(query) {
  const q = query.toLowerCase();
  const results = mpState.ingredients.filter(i =>
    !q || i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q)
  ).slice(0, 20);

  const el = document.getElementById('mpIngResults');
  el.innerHTML = results.map(i =>

      <span style="color:var(--muted);font-size:11px;">per 100g: ${i.per_100g_kcal} kcal</span>
    </div>`
  ).join('');
}

function mpAddIngredient(id, name, kcal100, p100, f100, c100) {
  const grams = prompt('Grams of ' + name + '?', '100');
  if (!grams || isNaN(+grams)) return;
  const g = +grams;
  mpModularItems.push({ id, name, grams: g, kcal: Math.round(kcal100 * g / 100), p: Math.round(p100 * g / 100 * 10) / 10, f: Math.round(f100 * g / 100 * 10) / 10, c: Math.round(c100 * g / 100 * 10) / 10 });
  mpRenderModularSelected();
}

function mpRemoveModularItem(idx) {
  mpModularItems.splice(idx, 1);
  mpRenderModularSelected();
}

function mpRenderModularSelected() {
  const el = document.getElementById('mpModularSelected');
  if (!mpModularItems.length) { el.innerHTML = '<div style="color:var(--muted);font-size:12px;">No ingredients added yet.</div>'; document.getElementById('mpModularTotals').innerHTML = ''; return; }

  el.innerHTML = mpModularItems.map((item, i) =>
    `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;border-bottom:1px solid var(--line-soft);">
      <span>${esc(item.name)} (${item.grams}g)</span>
      <span style="color:var(--muted);">${item.kcal} kcal | P${item.p} F${item.f} C${item.c}
        <button style="color:var(--red);border:none;background:none;cursor:pointer;font-size:16px;margin-left:6px;" onclick="mpRemoveModularItem(${i})">&times;</button>
      </span>
    </div>`
  ).join('');

  const totals = mpModularItems.reduce((acc, i) => ({ kcal: acc.kcal + i.kcal, p: acc.p + i.p, f: acc.f + i.f, c: acc.c + i.c }), { kcal: 0, p: 0, f: 0, c: 0 });
  document.getElementById('mpModularTotals').innerHTML = `<strong>Total:</strong> ${totals.kcal} kcal | P: ${Math.round(totals.p)}g | F: ${Math.round(totals.f)}g | C: ${Math.round(totals.c)}g`;
}

async function mpAddModularMeal() {
  if (!mpModularItems.length) { toast('Add at least one ingredient', true); return; }
  const slot = document.getElementById('mpSlot').value;
  const totals = mpModularItems.reduce((acc, i) => ({ kcal: acc.kcal + i.kcal, p: acc.p + i.p, f: acc.f + i.f, c: acc.c + i.c }), { kcal: 0, p: 0, f: 0, c: 0 });
  const name = mpModularItems.map(i => i.name).join(' + ');
  const components = mpModularItems.map(i => ({ id: i.id, grams: i.grams }));

  const meal = {
    day: mpState.day, meal: name, recipe: '', kcal: totals.kcal, protein: Math.round(totals.p), fat: Math.round(totals.f), carbs: Math.round(totals.c),
    meal_type: 'modular', meal_slot: slot, components_json: JSON.stringify(components)
  };
  if (!mpState.plan[mpState.day]) mpState.plan[mpState.day] = [];
  mpState.plan[mpState.day].push(meal);
  mpModularItems = [];
  await mpSaveDay();
  document.querySelector('.mp-modal-bg').remove();

  const container = document.getElementById('logTabContent');
  renderMealPlanBuilder(container);
}
